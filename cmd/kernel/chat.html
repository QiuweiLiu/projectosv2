async function startHandoff(trigger, typedText){
  if(!state.conv) return;
  const convID = state.conv.id, gen = state.convGen || 0;
  const current = () => gen === (state.convGen || 0) && state.conv && state.conv.id === convID;
  if(state.conv.objectiveId){
    // Stay in chat: the flow card is the control surface; the card links to the
    // cockpit for monitoring.
    if(!showFlowCard()){
      await renderObjectiveFlow(state.conv.objectiveId);
      if(!current()) return;
      showFlowCard();
    }
    return;
  }
  const btn = (trigger && trigger.tagName) ? trigger : null;
  const oldText = btn ? btn.textContent : '';
  const note = String(typedText || '开始规划').trim();
  try {
    if(state.conv.status === 'running'){
      if(!confirm('聊天还在生成。托管前要先停止这一轮：已经写出的内容会保留，未完成的回答会中断。现在停止并继续？')) return;
      if(btn){ btn.disabled = true; btn.textContent = '正在停止…'; }
      try { await api('/api/conversations/' + encodeURIComponent(convID) + '/stop', {method:'POST'}); }
      catch(e) { /* the wait below is the real check */ }
      if(!current()) return;
      const c = await waitIdle(convID);
      if(!current()) return;
      if(!c) throw new Error('这一轮还没停下来，请稍后再试。');
      state.conv = c;
      syncRunControls(c.status);
      clearPermissionCards('本轮已停止，未处理的审批已失效。');
      markRunningTools('已中断');
      showStoppedNotice('interrupted', '');
    }
    if(btn){ btn.disabled = true; btn.textContent = '正在整理目标…'; }
    removePlaceholders(); removeHandoffCard();
    addFlowPlaceholder('正在从这段对话里整理目标…');
    addMessage('user', note, '');
    state.hasUserMessage = true; updateToGoal();
    document.querySelectorAll('.suggest').forEach(el => el.remove());
    state.lastSuggestion = null;
    const res = await api('/api/conversations/' + encodeURIComponent(convID) + '/handoff/start', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:note})
    });
    if(!current()) return;
    removePlaceholders();
    mountHandoff(res.draft || {});
  } catch(e) {
    if(!current()) return;
    removePlaceholders();
    addFlowPlaceholder('目标提取失败：' + e.message, 'error');
  } finally {
    if(btn && current()){ btn.disabled = false; btn.textContent = state.conv && state.conv.objectiveId ? '查看托管流程' : oldText; }
  }
}

function mountHandoff(d){
  removeHandoffCard(); removePlaceholders();
  const tpl = $('handoffTpl');
  if(!tpl || !tpl.content || !tpl.content.firstElementChild) return;
  const card = tpl.content.firstElementChild.cloneNode(true);
  card.classList.add('inline', 'handoff-inline');
  $('messages').appendChild(card);
  state.handoff = d;
  if(d.status === 'confirming'){
    card.querySelectorAll('.hs-editbtn').forEach(el => { el.style.display = 'none'; });
    const confirm = $('hConfirm'); if(confirm) confirm.textContent = '继续确认目标';
    const note = card.querySelector('.hs-note'); if(note) note.textContent = '上次确认未完成；重试会继续同一个目标，不会重复创建';
  }
  $('hGoal').value = d.goal || '';
  $('hConstraints').value = (d.constraints || []).join('\n');
  $('hExpected').value = (d.expectedOutputs || []).join('\n');
  $('hAcceptance').value = (d.acceptance || []).join('\n');
  $('hDecisions').value = (d.decisions || []).join('\n');
  const b = d.budget || {};
  $('hMaxTokens').value = b.maxTokens || 600000;
  $('hSource').textContent = '来源消息 ' + ((d.sourceMessageIds || []).length) + ' 条 · 上下文 ' + String(d.contextVersion || '—').slice(0,10);
  $('hError').textContent = '';
  $('hConfirm').disabled = false;
  $('hConfirm').textContent = '创建目标并生成计划';
  delete $('hConfirm').dataset.action;
  card.querySelectorAll('.hs-editbtn').forEach(btn => btn.onclick = () => {
    const ta = card.querySelector('#' + btn.dataset.edit);
    if(!ta) return;
    const hidden = ta.classList.toggle('hidden');
    btn.textContent = hidden ? '编辑' : '收起';
    if(!hidden) ta.focus();
  });
  card.querySelectorAll('textarea').forEach(el => el.addEventListener('input', renderHandoffPreview));
  $('hCancel').onclick = closeHandoff;
  $('hCancelTop').onclick = closeHandoff;
  $('hConfirm').onclick = () => submitHandoff(card);
  renderHandoffPreview();
  card.scrollIntoView({block:'start'});
  $('hGoal').focus();
}

async function submitHandoff(card){
  if(!state.handoff || !state.conv) return;
  const convID = state.conv.id, handoff = state.handoff, gen = state.convGen || 0;
  const current = () => gen === (state.convGen || 0) && state.conv && state.conv.id === convID;
  const confirmBtn = $('hConfirm');
  if(!confirmBtn) return;
  if(confirmBtn.dataset.action === 'cockpit'){
    location.href = '/#goal=' + encodeURIComponent(confirmBtn.dataset.objective || '');
    return;
  }
  const budget = { maxTokens: Number($('hMaxTokens').value) || 600000 };
  confirmBtn.disabled = true; confirmBtn.textContent = '正在创建并生成计划…';
  $('hError').textContent = '';
  try {
    if(handoff.status !== 'confirming'){
      await api('/api/conversations/' + encodeURIComponent(convID) + '/handoff/' + encodeURIComponent(handoff.id), {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({goal:$('hGoal').value.trim(), constraints:handoffLines('hConstraints'),
          expectedOutputs:handoffLines('hExpected'), acceptance:handoffLines('hAcceptance'),
          decisions:handoffLines('hDecisions'), budget})
      });
      if(!current()) return;
    }
    handoff.budget = budget;
    handoff.status = 'confirming';
    const res = await api('/api/conversations/' + encodeURIComponent(convID) + '/handoff/' + encodeURIComponent(handoff.id) + '/confirm', {method:'POST'});
    if(!current()) return;
    state.objectiveBudget = res.budget || budget;
    state.conv.objectiveId = res.objective || state.conv.objectiveId;
    document.querySelectorAll('.suggest').forEach(el => el.remove());
    state.lastSuggestion = null;
    $('toGoalBtn').textContent = state.conv && state.conv.objectiveId ? '查看托管流程' : '转为托管目标';
    await loadConvs();
    if(!current()) return;
    closeHandoff();
    await loadObjPanel(res.objective, gen);
    if(!current()) return;
    state.flowSig = '';
    await renderObjectiveFlow(res.objective);
  } catch(e) {
    if(!current()) return;
    $('hError').textContent = e.message;
    confirmBtn.disabled = false; confirmBtn.textContent = '创建目标并生成计划';
  }
}

async function loadObjectiveBudget(){
  state.objectiveBudget = null;
  if(!state.conv || !state.conv.objectiveId) return;
  const convID = state.conv.id, gen = state.convGen || 0;
  try {
    const d = await api('/api/conversations/'+encodeURIComponent(convID)+'/handoff');
    if(gen !== (state.convGen || 0) || !state.conv || state.conv.id !== convID) return;
    if(d && d.status === 'confirmed' && d.budget) state.objectiveBudget = d.budget;
  } catch(e) {
    if(gen !== (state.convGen || 0)) return;
    if(e.status !== 404) $('eventHint').textContent = '读取托管预算失败：' + e.message;
  }
}

async function waitObjectiveJob(id, donePrefix, failPrefix, timeoutMs){
  const deadline = Date.now() + (timeoutMs || 300000);
  while(Date.now() < deadline){
    let raw = '';
    try { const jobs = await api('/api/jobs'); raw = (jobs && jobs[id]) || ''; } catch(e) {}
    if(raw.startsWith(donePrefix)) return true;
    if(raw.startsWith(failPrefix)) throw new Error(raw);
    await new Promise(r => setTimeout(r, 2000));
  }
  throw new Error('操作耗时较长；结果会在卡片或驾驶舱里更新。');
}

async function flowAction(id, fn, busyText){
  const convID = state.conv && state.conv.id, gen = state.convGen || 0;
  const busyKey = convID + ':' + gen;
  if(state.flowBusyKey) return;
  state.flowBusy = true; state.flowBusyKey = busyKey;
  const card = document.querySelector('.flow-card[data-obj="' + id + '"]');
  if(card){
    const note = card.querySelector('.flow-busy');
    if(note) note.textContent = busyText || '正在处理…';
    card.querySelectorAll('button,textarea').forEach(el => el.disabled = true);
  }
  try { await fn(); }
  catch(e) { alert(clip(String(e.message || e).replace(/^replan failed:\s*/, '重新规划失败：'), 300)); }
  finally {
    if(state.flowBusyKey === busyKey){ state.flowBusy = false; state.flowBusyKey = ''; }
    if(gen === (state.convGen || 0) && state.conv && state.conv.id === convID){
      state.flowSig = '';
      await renderObjectiveFlow(id);
    }
  }
}

async function runObjective(id, approveRisk){
  const b = state.objectiveBudget || {};
  try { await api('/api/objectives/' + encodeURIComponent(id) + '/confirm', {method:'POST', body:'{}'}); }
  catch(e) { if(e.status !== 409) throw e; }
  await api('/api/objectives/' + encodeURIComponent(id) + '/run', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({reviewer:true, approveRisk:!!approveRisk,
      maxTokens:b.maxTokens||600000})
  });
}

function friendlyError(err){
  const e = String(err || '');
  if(/review budget.*exhausted|review not recorded/i.test(e)) return '审查次数用尽，需要重新规划';
  if(/dependency blocked/i.test(e)) return '上游任务未完成';
  if(/usage unknown after unrecorded review/i.test(e)) return '预算用量未知，需要人工确认';
  if(/artifact unchanged/i.test(e)) return '产物没有变化，审查结论仍然阻止通过';
  if(/budget/i.test(e)) return '预算用尽';
  if(/timeout/i.test(e)) return '执行超时';
  return e || '被卡住';
}
function objectiveView(d){
  const s = d.objective.status, c = d.counts || {};
  if(s === 'active'){
    if(c.running > 0) return {label:'执行中', cls:'run'};
    if(c.blocked > 0) return {label:'已卡住', cls:'bad'};
    if(c.total && c.accepted === c.total) return {label:'收尾中', cls:'run'};
    if(c.pending > 0) return {label:'待执行', cls:'warn'};
  }
  const map = {completed:['已完成','ok'], failed:['未完成','bad'], cancelled:['已取消','plain'],
    draft:['草稿','plain'], planned:['待确认','warn'], paused:['已暂停','plain']};
  const v = map[s] || [s, 'plain'];
  return {label:v[0], cls:v[1]};
}
function flowStep(label, stateName){
  return '<span class="' + (stateName || '') + '">' + esc(label) + '</span>';
}

async function renderObjectiveFlow(objectiveId){
  const gen = state.convGen || 0;
  const id = objectiveId || (state.conv && state.conv.objectiveId);
  if(!id){
    document.querySelectorAll('.flow-card[data-obj]').forEach(el => el.remove());
    state.flowSig = ''; return;
  }
  if(state.flowBusyKey) return;
  let d, r, job = '';
  try {
    d = await api('/api/objectives/' + encodeURIComponent(id));
    r = await api('/api/objectives/' + encodeURIComponent(id) + '/progress').catch(() => null);
    const jobs = await api('/api/jobs').catch(() => null);
    job = (jobs && jobs[id]) || '';
  } catch(e) { return; }
  if(gen !== (state.convGen || 0) || !state.conv || state.conv.objectiveId !== id) return;
  const sig = [id, d.objective.status, d.objective.planVersion, JSON.stringify(d.counts || {}),
    JSON.stringify(d.approvalReasons || []), r && r.state, r && r.failure && r.failure.taskId,
    d.delivery ? 1 : 0, d.planStatus, job].join('|');
  if(sig === state.flowSig && document.querySelector('.flow-card[data-obj="' + id + '"]')) return;

  const view = objectiveView(d);
  const c = d.counts || {};
  const planned = d.objective.status === 'planned';
  const active = d.objective.status === 'active';
  const failed = d.objective.status === 'failed';
  const completed = d.objective.status === 'completed';
  const blocked = c.blocked || 0;
  const running = c.running || 0;
  const reasons = d.approvalReasons || [];
  const tasks = d.tasks || [];
  const pv = d.planVersion || d.objective.planVersion || 0;
  const planning = d.objective.status === 'draft' && !pv;
  const planFailed = job.startsWith('plan failed');
  if(planning){
    view.label = planFailed ? '计划失败' : '生成计划中';
    view.cls = planFailed ? 'bad' : 'run';
  }

  let blockedRows = '';
  if(blocked){
    const sample = tasks.filter(t => t.status === 'blocked').slice(0, 3);
    const details = await Promise.all(sample.map(t =>
      api('/api/tasks/' + encodeURIComponent(t.id) + '?objective=' + encodeURIComponent(id)).catch(() => null)));
    blockedRows = sample.map((t, i) => '<div class="t"><b>' + esc(t.id) + '</b><span>' +
      esc(friendlyError(details[i] && details[i].error)) + '</span></div>').join('');
    if(gen !== (state.convGen || 0) || !state.conv || state.conv.objectiveId !== id) return;
  }

  // Plan-level approval is only "before start". A blocked goal also needs a
  // human decision, but the risk box must not reappear as if nothing ran.
  const preStartApproval = planned ||
    (active && blocked === 0 && reasons.length > 0 && !running && (c.accepted || 0) === 0);
  const approvalStep = preStartApproval || blocked > 0;
  const executing = running > 0 || (active && c.pending > 0 && blocked === 0 && !preStartApproval);
  let stepHTML = flowStep('目标', 'done') +
    flowStep('计划 v' + pv, pv ? 'done' : 'on') +
    flowStep('审批', approvalStep ? 'on' : (active ? 'done' : '')) +
    flowStep('执行', executing ? 'on' : ((running || c.accepted > 0 || completed) ? 'done' : '')) +
    flowStep('验收', (active && c.total && c.accepted === c.total) ? 'on' : (completed ? 'done' : '')) +
    flowStep('交付', completed || d.delivery ? 'on' : '');

  let text = '';
  if(planFailed) text = '计划生成失败：' + clip(job.replace(/^plan failed:\s*/, ''), 220);
  else if(planning) text = '正在生成计划…（1–2 分钟）';
  else if(completed) text = '已完成，交付与证据已生成。';
  else if(failed) text = '目标未完成：有任务没有通过，且没有新的替代计划。';
  else if(planned) text = '计划 v' + pv + ' 已生成，共 ' + (tasks.length || c.total) + ' 个任务。确认后才会开始执行。';
  else if(blocked) text = '目标当前没有在运行，有 ' + blocked + ' 个任务被卡住。';
  else if(running) text = '执行中：' + (c.accepted||0) + '/' + (c.total||tasks.length) + ' 已通过。';
  else if(c.pending) text = '待执行：' + c.pending + ' 个任务可以开始。';
  else if(d.delivery) text = '交付已生成。';

  const budget = state.objectiveBudget;
  const budgetText = budget
    ? ('token 预算：' + fmtTokens(budget.maxTokens||600000))
    : '';

  let risk = '';
  if(reasons.length && preStartApproval){
    risk = '<div class="flow-risk"><b>开始前需要你确认</b>' +
      reasons.slice(0,6).map(x => '<div>' + esc(String(x).replace(/^(\S+) runs: /, '$1 · 命令校验：')) + '</div>').join('') +
      (reasons.length > 6 ? '<div>还有 ' + (reasons.length-6) + ' 条…</div>' : '') + '</div>';
  }

  let taskRows = '';
  if(tasks.length && !completed){
    taskRows = '<div class="flow-tasks">' + tasks.slice(0,6).map(t =>
      '<div class="t"><b>' + esc(t.id) + '</b><span>' + esc(clip(t.artifactPath || t.id, 34)) + ' · ' + esc(taskLabel(t.status)) + '</span></div>').join('') +
      (tasks.length > 6 ? '<div class="t"><b>…</b><span>还有 ' + (tasks.length-6) + ' 个任务</span></div>' : '') + '</div>';
  }
  if(blockedRows) taskRows += '<div class="flow-tasks">' + blockedRows + '</div>';

  const cockpit = '/#goal=' + encodeURIComponent(id);
  let actions = '';
  if(planning){
    actions += (planFailed || job !== 'planning')
      ? '<button class="btn primary" data-act="plan">' + (planFailed ? '重新生成计划' : '生成计划') + '</button>'
      : '<button class="btn" disabled>正在生成计划…</button>';
    actions += '<button class="btn danger" data-act="cancel">取消目标</button>';
  } else if(planned){
    actions += '<button class="btn primary" data-act="start">' + (reasons.length ? '批准并开始执行' : '确认计划并开始执行') + '</button>';
    actions += '<button class="btn" data-act="edit-goal">调整目标</button>';
  } else if(active){
    if(running) actions += '<button class="btn" data-act="pause">暂停调度</button>';
    if(d.pauseRequested) actions += '<button class="btn" data-act="resume">继续调度</button>';
    if(blocked){
      if(r && (r.failure && r.failure.requiresApproval || r.state === 'needs_approval' || r.state === 'recoverable_failure'))
        actions += '<button class="btn primary" data-act="recover">批准恢复并重试</button>';
      actions += '<button class="btn" data-act="replan">重新规划</button>';
      actions += '<button class="btn" data-act="adjust">调整计划</button>';
    } else if(c.pending && !running){
      // Plan-level approval (risk / commands) is not a recovery; the risk box
      // above lists it and this button is the explicit approval.
      actions += '<button class="btn primary" data-act="start">' +
        (reasons.length ? '批准并开始执行' : '开始执行') + '</button>';
    }
    if(active) actions += '<button class="btn danger" data-act="cancel">取消目标</button>';
  } else if(failed){
    actions += '<button class="btn primary" data-act="replan">重新规划</button>';
    actions += '<button class="btn danger" data-act="cancel">取消目标</button>';
    actions += '<button class="btn" data-act="detach">从对话移除</button>';
  } else if(completed){
    actions += '<a class="btn primary" href="' + cockpit + '">查看交付</a>';
    actions += '<button class="btn" data-act="detach">从对话移除</button>';
  } else if(d.objective.status === 'cancelled'){
    actions += '<button class="btn" data-act="detach">从对话移除</button>';
  }
  actions += '<a class="link" href="' + cockpit + '">驾驶舱 →</a>';

  const card = document.createElement('div');
  card.className = 'flow-card'; card.dataset.obj = id;
  card.innerHTML =
    '<div class="flow-head"><b>托管流程</b><span class="pill ' + view.cls + '">' + esc(view.label) + '</span>' +
      '<button class="flow-toggle" type="button">' + (state.flowCollapsed ? '展开' : '收起') + '</button>' +
      '<span class="flow-busy"></span></div>' +
    '<div class="flow-steps">' + stepHTML + '</div>' +
    '<div class="flow-text">' + esc(text) + (budgetText ? '<div class="muted" style="margin-top:4px">' + esc(budgetText) + '</div>' : '') + '</div>' +
    taskRows + risk +
    '<div class="flow-adjust hidden"><textarea name="flow-adjust" placeholder="告诉助手要改什么，例如：只要 60 秒，不需要单独的分镜文件"></textarea>' +
      '<div style="margin-top:6px"><button class="btn small primary" data-act="apply-adjust">重新规划并应用</button></div></div>' +
    '<div class="flow-actions">' + actions + '</div>';

  document.querySelectorAll('.flow-card[data-obj]').forEach(el => el.remove());
  const dock = $('objectiveFlow');
  if(dock) dock.appendChild(card);
  state.flowSig = sig;
  if(state.flowCollapsed) card.classList.add('collapsed');

  const toggle = card.querySelector('.flow-toggle');
  if(toggle) toggle.onclick = () => {
    state.flowCollapsed = !state.flowCollapsed;
    card.classList.toggle('collapsed', state.flowCollapsed);
    toggle.textContent = state.flowCollapsed ? '展开' : '收起';
  };
  const act = (name, fn) => {
    const b = card.querySelector('[data-act="' + name + '"]');
    if(b) b.onclick = fn;
  };
  act('start', () => flowAction(id, () => runObjective(id, reasons.length > 0), '正在启动执行…'));
  act('recover', () => flowAction(id, async () => {
    await api('/api/objectives/' + encodeURIComponent(id) + '/recover', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{"approve":true}'});
    state.flowSig = '';
  }, '正在恢复…'));
  act('plan', () => flowAction(id, async () => {
    await api('/api/objectives/' + encodeURIComponent(id) + '/plan', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'
    });
    await waitObjectiveJob(id, 'planned', 'plan failed');
    state.flowSig = '';
  }, '正在生成计划…（1–2 分钟）'));
  act('replan', () => flowAction(id, async () => {
    await api('/api/objectives/' + encodeURIComponent(id) + '/replan', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    await waitObjectiveJob(id, 'replanned', 'replan failed');
    state.flowSig = '';
  }, '正在重新规划…（1–2 分钟）'));
  act('adjust', () => {
    const box = card.querySelector('.flow-adjust');
    if(!box) return;
    card.dataset.adjust = 'plan';
    const ta = box.querySelector('textarea');
    if(ta){ ta.value = ''; ta.placeholder = '告诉助手要改什么，例如：只要 60 秒，不需要单独的分镜文件'; }
    const apply = box.querySelector('[data-act="apply-adjust"]');
    if(apply) apply.textContent = '重新规划并应用';
    box.classList.remove('hidden');
    if(ta) ta.focus();
  });
  act('edit-goal', () => {
    const box = card.querySelector('.flow-adjust');
    if(!box) return;
    card.dataset.adjust = 'goal';
    const ta = box.querySelector('textarea');
    if(ta){ ta.value = d.objective.goal || ''; ta.placeholder = '修改目标本身；保存后会重新生成计划'; }
    const apply = box.querySelector('[data-act="apply-adjust"]');
    if(apply) apply.textContent = '保存目标并重新生成计划';
    box.classList.remove('hidden');
    if(ta) ta.focus();
  });
  act('apply-adjust', () => {
    const box = card.querySelector('.flow-adjust');
    const ta = box && box.querySelector('textarea');
    const text = ta ? ta.value.trim() : '';
    if(!text){ if(ta) ta.focus(); return; }
    if(card.dataset.adjust === 'goal'){
      const convID = state.conv && state.conv.id, gen = state.convGen || 0;
      flowAction(id, async () => {
        await api('/api/objectives/' + encodeURIComponent(id) + '/amend', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({goal:text, constraints:d.objective.constraints || '',
            expected:d.objective.expectedOutcome || '', acceptance:d.objective.acceptance || ''})
        });
        await api('/api/objectives/' + encodeURIComponent(id) + '/plan', {
          method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'
        });
        await waitObjectiveJob(id, 'planned', 'plan failed');
        if(gen !== (state.convGen || 0) || !state.conv || state.conv.id !== convID) return;
        state.conv.objectiveId = id;
        state.flowSig = '';
      }, '正在保存目标并重新生成计划…（1–2 分钟）');
      return;
    }
    flowAction(id, async () => {
      await api('/api/objectives/' + encodeURIComponent(id) + '/replan', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({instruction:text})});
      await waitObjectiveJob(id, 'replanned', 'replan failed');
      state.flowSig = '';
    }, '正在按你的说明重新规划…（1–2 分钟）');
  });
  act('pause', () => flowAction(id, () => api('/api/objectives/' + encodeURIComponent(id) + '/pause', {method:'POST', body:'{}'}), '正在暂停…'));
  act('resume', () => flowAction(id, () => api('/api/objectives/' + encodeURIComponent(id) + '/unpause', {method:'POST', body:'{}'}), '正在继续…'));
  act('detach', async () => {
    if(!confirm('只断开这个对话与目标的关联；目标仍保留在驾驶舱，不会被删除。继续？')) return;
    const convID = state.conv && state.conv.id, gen = state.convGen || 0;
    if(!convID) return;
    try {
      await api('/api/conversations/' + encodeURIComponent(convID) + '/detach-objective', {method:'POST'});
      if(gen !== (state.convGen || 0) || !state.conv || state.conv.id !== convID) return;
      state.conv.objectiveId = '';
      document.querySelectorAll('.flow-card[data-obj]').forEach(el => el.remove());
      state.flowSig = ''; state.objectiveBudget = null;
      $('toGoalBtn').textContent = '转为托管目标';
      if($('objLabel')) $('objLabel').textContent = '';
      $('objSel').value = '';
      await loadObjPanel(null, gen);
      await loadConvs();
    } catch(e) { if(gen === (state.convGen || 0)) alert('断开失败：' + e.message); }
  });
  act('cancel', () => {
    if(!confirm('确定取消这个目标？已通过的任务会保留，未完成的会停下。')) return;
    flowAction(id, () => api('/api/objectives/' + encodeURIComponent(id) + '/cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{"reason":"用户从聊天取消"}'}), '正在取消…');
  });

  await loadObjPanel(id, gen);
}
function startStream(id, initialAfter){
  const gen = state.convGen || 0;
  const ctrl = new AbortController(); state.stream = ctrl;
  (async () => {
    let after = initialAfter || 0;
    while(!ctrl.signal.aborted){
      try {
        const res = await fetch('/api/conversations/'+encodeURIComponent(id)+'/events?after='+after, {
          headers:{'X-Kernel-Token':state.token}, signal:ctrl.signal
        });
        if(res.status === 401){ showTokenPrompt(); return; }
        if(!res.ok) throw new Error('SSE '+res.status);
        if(gen !== (state.convGen || 0) || !state.conv || state.conv.id !== id) return;
        if(state.ssErr){
          state.ssErr = false;
          $('eventHint').textContent = '已重新连接，正在同步…';
          syncRunControls(state.conv.status === 'running' ? 'running' : 'idle');
          const latest = await resyncConversation(id, gen);
          if(latest === null){ $('eventHint').textContent = '同步失败，请重新打开对话'; return; }
          after = latest;
        }
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while(true){
          const {value, done} = await reader.read();
          if(done) break;
          buf += dec.decode(value, {stream:true});
          let idx;
          while((idx = buf.indexOf('\n\n')) >= 0){
            const chunk = buf.slice(0, idx); buf = buf.slice(idx+2);
            const resync = handleSSE(chunk, id, gen, seq => { after = Math.max(after, seq); });
            if(resync){
              const latest = await resyncConversation(id, gen);
              if(latest === null){ $('eventHint').textContent = '同步失败，请重新打开对话'; return; }
              after = latest;
            }
          }
        }
      } catch(e) {
        if(ctrl.signal.aborted) return;
        if(gen !== (state.convGen || 0) || !state.conv || state.conv.id !== id) return;
        state.ssErr = true;
        $('eventHint').textContent = '连接断开，正在重连…';
        $('status').textContent = '连接中断';
        $('status').className = 'badge warn';
        $('send').disabled = true;
      }
      await new Promise(r => setTimeout(r, 1200));
    }
  })();
}

function renderSuggestion(d){
  if(!d || !d.goal) return;
  // A conversation can produce a suggestion before its handoff is confirmed;
  // once it is managed the old card must not come back on reload.
  if(state.conv && state.conv.objectiveId){
    document.querySelectorAll('.suggest').forEach(el => el.remove());
    return;
  }
  const key='suggestDismissed:' + (state.conv ? state.conv.id : '');
  try {
    const list=JSON.parse(localStorage.getItem(key) || '[]');
    if(d.sourceMessageId && list.includes(d.sourceMessageId)) return;
  } catch(e) {}
  const src=String(d.sourceMessageId || '');
  const assistants=[...document.querySelectorAll('.msg.assistant')];
  const last=assistants.length ? assistants[assistants.length-1] : null;
  if(src && last && last.dataset.mid && last.dataset.mid !== src) return;
  state.lastSuggestion = d;
  document.querySelectorAll('.suggest').forEach(el => el.remove());
  const box=$('messages');
  const el=document.createElement('div');
  el.className='suggest'; el.dataset.source=src;
  el.innerHTML='<div class="suggest-mark">◎</div><div class="suggest-body">'+
    '<b>这看起来是一个可以托管的目标</b>'+
    '<p>'+esc(d.goal)+'</p>'+
    (d.reason ? '<div class="why">'+esc(d.reason)+'</div>' : '')+
    '<div class="suggest-actions">'+
    '<button class="btn small primary" type="button" data-act="open">开始规划</button>'+
    '<button class="btn small" type="button" data-act="dismiss">暂不</button></div></div>';
  const open=el.querySelector('[data-act="open"]');
  open.onclick=()=>startHandoff(open, '开始规划');
  el.querySelector('[data-act="dismiss"]').onclick=()=>{
    try {
      const list=JSON.parse(localStorage.getItem(key) || '[]');
      if(src && !list.includes(src)){ list.push(src); localStorage.setItem(key, JSON.stringify(list)); }
    } catch(e) {}
    el.remove();
  };
  box.appendChild(el);
  scrollBottom();
}

function handleSSE(chunk, id, gen, advance){
  if(gen !== (state.convGen || 0) || !state.conv || state.conv.id !== id) return false;
  const lines = chunk.split('\n');
  let seq = 0, data = '', eventName = '';
  for(const line of lines){
    if(line.startsWith('event:')) eventName = line.slice(6).trim();
    if(line.startsWith('id:')) seq = Number(line.slice(3).trim()) || 0;
    if(line.startsWith('data:')) data += line.slice(5).trim();
  }
  if(eventName === 'resync') return true;
  if(!data) return false;
  if(seq){
    if(state.lastSeq && seq <= state.lastSeq) return;
    state.lastSeq = seq;
    advance(seq);
  }
  let ev; try { ev = JSON.parse(data); } catch(e) { return; }
  if(state.conv && state.conv.id !== id) return;
  const d = ev.data || {};
  $('eventHint').textContent = '实时';
  if(ev.kind === 'handoff_suggestion'){
    renderSuggestion(d);
  } else if(ev.kind === 'reasoning_started'){
    hideThinking();
    startReasoning();
  } else if(ev.kind === 'reasoning_delta'){
    appendReasoning(d.delta || '');
  } else if(ev.kind === 'reasoning_ended'){
    endReasoning(d.text || '');
  } else if(ev.kind === 'text_delta'){
    hideThinking();
    if(!state.reasoningExpanded) collapseReasoning();
    const stopped=$('stoppedNote'); if(stopped) stopped.remove();
    if(!state.streaming){
      state.streaming = addMessage('assistant', '', '');
      if(state.streaming) state.streaming.classList.add('streaming');
    }
    if(state.streaming){ state.streaming.textContent += d.delta || ''; scrollBottom(); }
  } else if(ev.kind === 'assistant'){
    hideThinking();
    if(state.streaming){
      state.streaming.classList.remove('streaming');
      state.streaming.innerHTML = md(d.text || state.streaming.textContent);
      if(d.messageId && state.streaming.parentElement) state.streaming.parentElement.dataset.mid = d.messageId;
      state.streaming = null;
    } else addMessage('assistant', d.text || '', d.messageId || '');
    scrollBottom();
  } else if(ev.kind === 'tool'){
    hideThinking();
    renderTool(d);
  } else if(ev.kind === 'tool_result'){
    const el = document.querySelector('[data-tool="'+CSS.escape(String(d.id || ''))+'"] .th .right');
    if(el) el.textContent = d.status === 'ok' ? '完成' : '失败';
    if(state.conv && state.conv.status === 'running') showThinking('正在继续');
  } else if(ev.kind === 'permission_judging'){
    hideThinking();
    renderPermissionJudging(d);
  } else if(ev.kind === 'permission_auto'){
    document.querySelectorAll('[data-perm="'+CSS.escape(String(d.requestId || ''))+'"]').forEach(el => el.remove());
    $('approvalInspector').innerHTML = '<div class="hint">' +
      (d.source === 'readonly' ? '已自动允许只读操作：' : '模型已自动允许低风险：') +
      esc(d.action || '工具调用') + (d.reason ? ' · ' + esc(d.reason) : '') + '</div>';
    updateInspectorBadges();
  } else if(ev.kind === 'permission'){
    hideThinking();
    document.querySelectorAll('[data-perm="'+CSS.escape(String(d.requestId || ''))+'"]').forEach(el => el.remove());
    renderPermission(d);
  } else if(ev.kind === 'permission_replied'){
    const el = document.querySelector('[data-perm="'+CSS.escape(String(d.requestId || ''))+'"]');
    if(el && !el.classList.contains('question-card')) el.remove();
    if(state.conv && state.conv.status === 'running') showThinking('正在继续');
    if(!document.querySelector('.permission')){
      $('approvalInspector').innerHTML = '<div class="hint">当前没有待处理审批。</div>';
    }
    updateInspectorBadges();
  } else if(ev.kind === 'status'){
    const s = d.status || 'idle';
    if(state.conv) state.conv.status = s;
    syncRunControls(s);
    if(s !== 'running'){
      hideThinking(); endReasoning('');
      const cut = s === 'interrupted' || s === 'error';
      clearPermissionCards(cut
        ? '本次运行已中断，未处理的审批已失效。'
        : '本轮已结束，未处理的审批已失效。');
      markRunningTools(cut ? '已中断' : '未完成');
      document.querySelectorAll('.question-card').forEach(el => el.remove());
    }
    if(s === 'interrupted' || s === 'error'){
      showStoppedNotice(s, d.error || '');
    }
    syncConvBadge(s);
    if(s !== 'running' && state.streaming){ state.streaming.classList.remove('streaming'); state.streaming = null; }
  } else if(ev.kind === 'error'){
    hideThinking();
    addMessage('assistant', d.message || '聊天执行失败', '').classList.add('error');
    $('status').textContent = '错误'; $('status').className = 'badge error';
  }
  return false;
}

async function resyncConversation(id, gen){
  const current = () => (gen === undefined || gen === (state.convGen || 0)) && state.conv && state.conv.id === id;
  if(!current()) return;
  state.resyncCount = (state.resyncCount || 0) + 1;
  if(state.resyncCount > 3){
    $('eventHint').textContent = '状态补偿失败，请重新打开对话';
    return;
  }
  try {
    const d = await api('/api/conversations/'+encodeURIComponent(id));
    if(!current()) return null;
    state.detail = d;
    state.conv = d.conversation;
    state.lastSeq = d.lastEventSeq || 0;
    renderMessages(d.messages || []);
    document.querySelectorAll('#approvalDock .permission').forEach(el => el.remove());
    $('approvalInspector').innerHTML = '<div class="hint">当前没有待处理审批。</div>';
    renderPendingPermissions(d.permissions || []);
    updateInspectorBadges();
    if(d.conversation.status === 'running') showThinking('正在思考'); else hideThinking();
    if(d.conversation.objectiveId) renderObjectiveFlow(d.conversation.objectiveId);
    $('eventHint').textContent = '已补偿历史，继续实时';
    return state.lastSeq;
  } catch(e) {
    if(current()) $('eventHint').textContent = '补偿失败：'+e.message;
    return null;
  }
}

function toolLabel(d){
  const input = d.input || {};
  if(input.command) return 'shell';
  if(input.path && Object.prototype.hasOwnProperty.call(input,'content')) return 'write';
  if(input.path) return 'read';
  return d.name || 'tool';
}
function renderTool(d){
  const box = $('messages');
  const el = document.createElement('div');
  el.className = 'tool'; el.dataset.tool = d.id || '';
  const input = d.input ? JSON.stringify(d.input) : '';
  el.innerHTML = '<div class="th"><span><b>'+esc(toolLabel(d))+'</b></span><span class="right">执行中</span></div>' +
    (input ? '<pre>'+esc(clip(input, 400))+'</pre>' : '');
  box.appendChild(el); keepFlowLast(); scrollBottom();
}

function fieldHTML(f, idx){
  const title=esc(f.title || f.key || ('问题 '+(idx+1)));
  const desc=f.description ? '<div class="q-desc">'+esc(f.description)+'</div>' : '';
  const req=f.required ? ' <span style="color:var(--bad)">*</span>' : '';
  const key=esc(f.key);
  let body='';
  if(f.type === 'multiselect'){
    body=(f.options||[]).map(o=>'<label class="q-opt"><input type="checkbox" value="'+esc(o.value)+'"><span><b>'+esc(o.label||o.value)+'</b>'+(o.description?'<small>'+esc(o.description)+'</small>':'')+'</span></label>').join('');
  } else if(f.type === 'boolean'){
    body='<label class="q-opt"><input type="checkbox"><span><b>'+esc(f.title||'是')+'</b></span></label>';
  } else if(f.type === 'number' || f.type === 'integer'){
    body='<input class="q-input" type="number" '+(f.type==='integer'?'step="1"':'step="any"')+'>';
  } else if(f.type === 'external'){
    body='<a class="link" href="'+esc(f.url||'#')+'" target="_blank" rel="noopener">打开链接</a>';
  } else if(f.type === 'string' && (f.options||[]).length){
    body=(f.options||[]).map((o,i)=>'<label class="q-opt"><input type="radio" name="q_'+idx+'" value="'+esc(o.value)+'"><span><b>'+esc(o.label||o.value)+'</b>'+(o.description?'<small>'+esc(o.description)+'</small>':'')+'</span></label>').join('');
    if(f.custom) body+='<input class="q-input" type="text" placeholder="其他（可选）" style="margin-top:4px">';
  } else {
    body='<input class="q-input" type="text" placeholder="'+esc(f.placeholder||'输入回答')+'">';
  }
  return '<div class="q-field" data-key="'+key+'"><div class="q-title">'+title+req+'</div>'+desc+body+'</div>';
}

function renderFormCard(card, form, convID, gen){
  const body=card.querySelector('.q-body');
  body.innerHTML = (form.fields||[]).map(fieldHTML).join('') +
    '<div class="q-actions"><button class="btn small primary" type="button" data-act="submit">提交回答</button></div>' +
    '<div class="q-error"></div>';
  scrollBottom();
  const btn=body.querySelector('[data-act="submit"]');
  btn.onclick=async () => {
    const answer={};
    const errBox=body.querySelector('.q-error');
    errBox.textContent='';
    try {
      for(const f of (form.fields||[])){
        const group=body.querySelector('.q-field[data-key="'+CSS.escape(f.key)+'"]');
        if(!group) continue;
        if(f.type === 'multiselect'){
          answer[f.key]=[...group.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);
        } else if(f.type === 'boolean'){
          answer[f.key]=!!group.querySelector('input[type="checkbox"]').checked;
        } else if(f.type === 'number' || f.type === 'integer'){
          const v=group.querySelector('input').value;
          if(v !== '') answer[f.key]=Number(v);
        } else if(f.type === 'string'){
          const radio=group.querySelector('input[type="radio"]:checked');
          const text=group.querySelector('input[type="text"]');
          if(radio) answer[f.key]=radio.value;
          else if(text && text.value.trim()) answer[f.key]=text.value.trim();
        }
        const v=answer[f.key];
        if(f.required && (v === undefined || v === '' || (Array.isArray(v) && v.length === 0))){
          throw new Error('请填写：'+(f.title||f.key));
        }
      }
    } catch(e) { errBox.textContent=e.message; return; }
    btn.disabled=true; btn.textContent='提交中…';
    try {
      await api('/api/conversations/'+encodeURIComponent(convID)+'/forms/'+encodeURIComponent(form.id), {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({answer})
      });
      if(!convCurrent(convID, gen)) return;
      card.remove();
      $('approvalInspector').innerHTML='<div class="hint">已回答问题，模型继续。</div>';
      $('eventHint').textContent='已回答问题';
    } catch(e) {
      if(!convCurrent(convID, gen)) return;
      errBox.textContent='提交失败：'+e.message;
      btn.disabled=false; btn.textContent='提交回答';
    }
  };
}

async function loadQuestionForm(card, requestId){
  if(!state.conv) return;
  const convID = state.conv.id, gen = state.convGen || 0;
  try {
    await api('/api/conversations/'+encodeURIComponent(convID)+'/permissions/'+encodeURIComponent(requestId), {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({decision:'once'})
    });
  } catch(e) { /* another client may have allowed it */ }
  if(!convCurrent(convID, gen)) return;
  for(let i=0;i<12;i++){
    try {
      const res=await api('/api/conversations/'+encodeURIComponent(convID)+'/forms');
      if(!convCurrent(convID, gen)) return;
      const forms=res.forms || [];
      const form=forms.find(f => !f.state || f.state.status === 'pending') || forms[0];
      if(form){ renderFormCard(card, form, convID, gen); return; }
    } catch(e) {}
    await new Promise(r=>setTimeout(r,500));
    if(!convCurrent(convID, gen)) return;
  }
  if(!convCurrent(convID, gen)) return;
  if(state.conv.status !== 'running'){
    card.remove();
    $('approvalInspector').innerHTML='<div class="hint">当前没有待处理审批。</div>';
    return;
  }
  const body=card.querySelector('.q-body');
  if(body) body.innerHTML='<div class="hint">无法加载问题表单。可以停止本轮后重试。</div>';
}

    '<div class="hint" style="font-size:11.5px;color:#64748B">' +

function renderPendingPermissions(list){
  (list || []).forEach(p => renderPermission({
    requestId: p.id, action: p.action, resources: p.resources, message: p.message
  }));

function renderPermission(d){
  const permID = String(d.requestId || '');
  if(permID && document.querySelector('[data-perm="'+CSS.escape(permID)+'"]')) return;
  if(d.action === 'question'){ renderQuestionCard(d); return; }
  const box = $('approvalDock') || $('messages');
  const el = document.createElement('div');
  el.className = 'permission'; el.dataset.perm = d.requestId || '';
  el.innerHTML = '<b>需要批准：'+esc(d.action || '工具调用')+'</b>' +
    '<div class="hint" style="font-size:11.5px;color:#64748B">'+esc((d.resources || []).join(', ') || d.message || '')+'</div>' +
    (d.risk === 'high' && d.reason ? '<div class="hint" style="font-size:11.5px;color:#A15C00">模型判断为高风险：'+esc(d.reason)+'</div>' : '') +
    '<div class="row"><button class="btn small primary" data-p="once">允许一次</button>' +
    '<button class="btn small" data-p="always">总是允许</button>' +
    '<button class="btn small danger" data-p="reject">拒绝</button></div>';
  el.querySelectorAll('button').forEach(b => b.onclick = async () => {
    if(!state.conv) return;
    const convID = state.conv.id, gen = state.convGen || 0;
    try {
      await api('/api/conversations/'+encodeURIComponent(convID)+'/permissions/'+encodeURIComponent(d.requestId), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({decision:b.dataset.p, action:d.action || '', resources:d.resources || []})
      });
       if(!convCurrent(convID, gen)) return;
       el.remove();
       $('approvalInspector').innerHTML = '<div class="hint">审批已处理：'+esc(d.action || '工具调用')+'。</div>';
       updateInspectorBadges();
     } catch(e) {
       if(!convCurrent(convID, gen)) return;
       if(e.status === 404 || /not found/i.test(e.message)){
         el.remove();
         $('approvalInspector').innerHTML = '<div class="hint">这条审批已失效（本轮已结束或已在别处处理）。</div>';
         $('eventHint').textContent = '审批已失效';
         updateInspectorBadges();
       } else {
         alert('审批未提交：'+e.message);
       }
     }
   });
   box.appendChild(el); keepFlowLast(); scrollBottom();
   $('approvalInspector').innerHTML = '<b style="font-size:12px">待处理审批</b><div class="hint" style="margin-top:6px">'+esc(d.action || '工具调用')+' · 请求 '+esc(d.requestId || '—')+'</div><div class="hint" style="margin-top:6px">审批在输入框上方；可在输入区开启“帮我审批”，低风险会自动允许。</div>';
   setInspectorTab('approvals');
   setInspector(true);
   updateInspectorBadges();
}

async function boot(){
  bootToken();
  let status = null;
  try { status = await api('/api/status'); } catch(e) {}
  if(status){ state.remote = !!status.remote; showWorkspaceWarning(status.workspaceWarning); }
  if(!state.token){
    $('convs').innerHTML = '<div class="hint" style="padding:6px">在设置中输入控制令牌后加载对话</div>';
    $('messages').innerHTML = '<div class="empty"><b style="display:block;font-size:18px;color:var(--text);margin-bottom:8px">连接到本地工作区</b>打开输入区左下角的设置，填入控制令牌；令牌只保存在本地。</div>';
    $('send').disabled = true;
    showTokenPrompt();
    return;
  }
  if(!status){
    $('messages').innerHTML = '<div class="empty">无法连接 Kernel：请检查服务是否在运行</div>';
    $('connState').textContent = '连接失败';
    showTokenPrompt();
    return;
  }
  await loadModels();
  await loadApprovalRules();
  await loadProjects();
  await loadObjectives();
  await loadConvs();
  const first = state.convs[0];
  if(first) await selectConv(first.id);
  else renderEmptyState();
}
setInterval(() => {
  if(!state.conv || !state.conv.objectiveId || state.flowBusyKey) return;
  renderObjectiveFlow();
}, 5000);
boot();
</script>
</body>
</html>
