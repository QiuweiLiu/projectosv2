<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectOS · Chat</title>
<!-- Visual direction adapted from unslop by Damir Sokolovsky (CC BY 4.0). -->
<style>
  :root{
  --bg-sidebar:#F6F6F7; --bg-canvas:#FFFFFF; --bg-elevated:#FFFFFF;
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-soft:#F8F8F9; --side:#F6F6F7;
  --side-text:#111827; --side-muted:#6B7280; --side-line:rgba(15,23,42,.07);
  --line:rgba(15,23,42,.07); --line-strong:rgba(15,23,42,.12);
  --text:#111827; --text-primary:#111827; --text-secondary:#525866; --text-muted:#8B92A2;
  --muted:#525866; --faint:#8B92A2;
  --accent:#18181B; --accent-strong:#27272A; --accent-focus:#2563EB; --accent-soft:#F3F4F6;
  --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --radius:12px;
}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{display:grid;grid-template-columns:268px minmax(0,1fr) 336px;height:100vh}
  .side{background:var(--side);color:var(--side-text);border-right:0;display:flex;flex-direction:column;min-width:0}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 14px}
  .brand b{font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--side-text)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px;vertical-align:2px}
  .side-actions{padding:0 12px 14px;display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;color:var(--text);font-size:12.5px;transition:background .12s,border-color .12s,color .12s}
  .btn:hover{border-color:var(--line-strong);background:#fafafa}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn.small{padding:4px 8px;font-size:11.5px;border-radius:6px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .side .btn{background:transparent;border-color:var(--side-line);color:var(--side-text)}
  .side .btn:hover{background:#f0f0f1;border-color:rgba(15,23,42,.12)}
  .side .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .side .btn.primary:hover{background:var(--accent-strong)}
  .side-scroll{overflow:auto;flex:1;padding:0 10px 14px;scrollbar-color:#c7cad1 transparent}
  .side-section{font-size:11px;color:var(--side-muted);padding:18px 6px 8px;font-weight:500}
  .conv{padding:9px 10px;border-radius:7px;cursor:pointer;border:0;margin-bottom:2px;color:var(--side-text)}
  .conv:hover{background:#f0f0f1}
  .conv.on{background:#ffffff;box-shadow:inset 2px 0 0 var(--accent)}
  .conv .t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .p{font-size:11px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .side-foot{padding:12px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px}
  .side-foot input{border:1px solid #3a372e;border-radius:6px;padding:7px 8px;background:#ffffff;color:var(--side-text);font-size:11.5px}
  .side-foot input::placeholder{color:#9ca3af}
  .side-foot .hint{font-size:10.5px;color:var(--side-muted);line-height:1.55}
  .main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
  .top h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:3px}
  .top select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:5px 8px;font-size:11.5px;max-width:260px}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);white-space:nowrap}
  .badge.running{color:var(--accent);border-color:rgba(180,83,9,.2);background:var(--accent-soft)}
  .badge.error{color:var(--bad);border-color:rgba(185,28,28,.2);background:#fef2f2}
  .badge.ok{color:var(--ok);border-color:rgba(21,128,61,.2);background:#f0fdf4}
  .messages{flex:1;overflow:auto;padding:28px 24px 20px;scrollbar-color:rgba(15,23,42,.12) transparent}
  .empty{color:var(--muted);text-align:center;padding:64px 20px;font-size:12.5px;line-height:1.8}
  .msg{max-width:780px;margin:0 auto 18px;display:flex;gap:10px}
  .msg .who{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none;background:#eef0f3;color:var(--muted)}
  .msg.user .who{background:var(--accent);color:#fff}
  .msg .bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;white-space:pre-wrap;word-break:break-word;line-height:1.75;min-width:0;font-size:13.5px}
  .msg.user .bubble{background:var(--accent-soft);border-color:#e4d0c1}
  .msg .bubble.streaming::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .msg .bubble.error{border-color:rgba(185,28,28,.2);background:#fef2f2;color:var(--bad)}
  .msg .bubble pre.code{margin:12px 0;padding:12px 14px;background:#f8f8f9;border:1px solid var(--line);color:#111827;border-radius:10px;overflow:auto;font:12.5px/1.65 var(--mono);white-space:pre;max-height:420px}
  .msg .bubble pre.code code{background:transparent;border:0;color:inherit;padding:0;font:inherit}
  .msg .bubble code{background:#f4f4f5;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font:12.5px/1.5 var(--mono);color:#334155;overflow-wrap:anywhere}
  .msg .bubble p{margin:0 0 13px}
  .msg .bubble p:last-child{margin-bottom:0}
  .msg .bubble ul,.msg .bubble ol{margin:10px 0 14px;padding-left:22px}
  .msg .bubble li{margin:4px 0;padding-left:2px}
  .msg .bubble li::marker{color:var(--faint)}
  .msg .bubble h2{font-size:17px;margin:18px 0 8px;font-weight:600;letter-spacing:-.01em}
  .msg .bubble h3,.msg .bubble h4,.msg .bubble h5,.msg .bubble h6{margin:16px 0 7px;font-size:14.5px;font-weight:600;line-height:1.5}
  .msg .bubble strong{font-weight:600}
  .msg .bubble a{color:var(--accent);text-decoration:none}
  .msg .bubble a:hover{text-decoration:underline}
  .msg .bubble blockquote{margin:12px 0;padding:2px 0 2px 12px;border-left:2px solid var(--line-strong);color:var(--muted)}
  .msg .bubble hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .md-table-wrap{margin:12px 0;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .md-table-wrap table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.55}
  .md-table-wrap th,.md-table-wrap td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:80px}
  .md-table-wrap th{background:var(--panel-soft);font-weight:600;color:var(--text);white-space:nowrap}
  .md-table-wrap tr:last-child td{border-bottom:0}
  .md-table-wrap td{color:var(--text)}
  .msg{animation:msgIn .16s ease-out}
  @keyframes msgIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.msg{animation:none}}
  .tools{max-width:780px;margin:-6px auto 14px 34px;display:flex;flex-direction:column;gap:8px}
  .tool{border:0;border-left:2px solid var(--line-strong);background:transparent!important;box-shadow:none;border-radius:0;padding:5px 0 5px 10px;font-size:11.5px;max-width:780px;margin:0 auto 8px 34px}
  .tool .th{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
  .tool code{font:10.5px/1.5 var(--mono);word-break:break-all;color:var(--muted)}
  .tool pre{margin:5px 0 0;font:10.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto;color:var(--muted);background:transparent!important;border:0;box-shadow:none}
  .permission{max-width:780px;margin:0 auto 14px 34px;border:0;border-left:2px solid var(--warn);background:#fffbeb;border-radius:0;padding:9px 12px}
  .permission b{font-size:12px;color:var(--warn)}
  .permission .row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
  .composer{border-top:1px solid var(--line);background:var(--bg);padding:14px 24px 18px}
  .composer .box{max-width:820px;margin:0 auto;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);padding:10px;display:flex;gap:10px;align-items:flex-end}
  .composer .box:focus-within{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  .composer textarea{flex:1;border:0;outline:0;resize:none;min-height:44px;max-height:180px;padding:4px 2px;background:transparent;line-height:1.6;font-size:13.5px}
  .composer .send{height:35px;padding:0 15px;border-radius:7px}
  .composer .below{max-width:820px;margin:8px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
  .composer select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel);font-size:10.5px;color:var(--text)}
  .right{background:var(--panel-soft);border-left:1px solid var(--line);padding:18px 16px;overflow:auto;min-width:0;scrollbar-color:rgba(15,23,42,.12) transparent}
  .right h2{font-size:11px;color:var(--muted);font-weight:600;margin:0 0 10px}
  .right .card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 16px;margin:0 0 18px}
  .right .card:last-child{border-bottom:0}
  .right .kv{display:grid;grid-template-columns:56px minmax(0,1fr);gap:5px 8px;font-size:12px}
  .right .kv div:nth-child(odd){color:var(--muted)}
  .right .kv div:nth-child(even){min-width:0;overflow-wrap:anywhere}
  .right .task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
  .right .task:first-of-type{border-top:0}
  .right .task .id{grid-column:1/-1;width:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right .task span:nth-child(2){grid-column:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .right .task .st{grid-column:2;margin:0;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .right .hint{font-size:10.5px;color:var(--muted);line-height:1.65}
  .link{color:var(--accent-focus);text-decoration:none}
  .link:hover{text-decoration:underline}
button.link{border:0;background:transparent;padding:0;font:inherit;cursor:pointer;text-align:left}
  .hidden{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(20,18,14,.48);display:grid;place-items:center;z-index:60;padding:1rem}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(30,25,18,.18);width:min(46rem,100%);max-height:88vh;overflow:auto;padding:1.1rem 1.2rem}
  .modal-card h2{font-size:15px;margin:0 0 4px}
  .modal-card label{display:flex;flex-direction:column;gap:.25rem;font-size:11.5px;color:var(--muted);margin-top:.65rem}
  .modal-card input,.modal-card textarea{border:1px solid var(--line);border-radius:7px;padding:.45rem .55rem;font:inherit;color:var(--text);background:var(--panel)}
  .modal-card textarea{min-height:3.2rem;resize:vertical}
  .modal-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.9rem}
  .modal-note{font-size:10.5px;color:var(--muted);line-height:1.55;margin-top:.4rem}
  .handoff-sheet{width:min(780px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 64px rgba(16,24,40,.22);padding:24px;animation:sheetIn .16s ease-out}
  @keyframes sheetIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.handoff-sheet{animation:none}}
  .hs-head{display:flex;justify-content:space-between;gap:16px}
  .hs-badge{display:inline-block;font-size:11px;color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:2px 9px;margin-bottom:8px}
  .hs-head h2{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
  .hs-sub{font-size:12.5px;color:var(--muted);margin:0;line-height:1.65}
  .hs-close{border:0;background:transparent;font-size:20px;color:var(--faint);cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px;align-self:flex-start}
  .hs-close:hover{background:var(--panel-soft);color:var(--text)}
  .hs-goal{margin-top:18px;padding:14px 16px;background:var(--panel-soft);border:1px solid var(--line);border-radius:12px}
  .hs-goal label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .hs-goal textarea{width:100%;border:0;background:transparent;resize:vertical;font-size:15px;font-weight:600;line-height:1.6;color:var(--text);min-height:52px;outline:0}
  .hs-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:6px;font-size:11px;color:var(--faint)}
  .hs-link{border:0;background:transparent;color:var(--accent);font-size:11.5px;cursor:pointer;padding:0}
  .hs-flow{display:flex;align-items:center;gap:10px;margin:18px 0}
  .hs-step{display:flex;align-items:center;gap:8px;min-width:0}
  .hs-step div{display:flex;flex-direction:column}
  .hs-step b{font-size:12.5px;font-weight:600}
  .hs-step small{font-size:11px;color:var(--faint);white-space:nowrap}
  .hs-num{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
  .hs-line{height:1px;background:var(--line);flex:1;min-width:12px}
  .hs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hs-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
  .hs-card h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
  .hs-count{font-weight:400;color:var(--faint)}
  .hs-chips{display:flex;flex-wrap:wrap;gap:6px}
  .hs-chip{font-size:11.5px;color:#525866;background:var(--panel-soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px;max-width:100%;overflow-wrap:anywhere}
  .hs-list{margin:0;padding-left:16px;font-size:12px;line-height:1.65;color:var(--text)}
  .hs-list li{margin:2px 0;overflow-wrap:anywhere}
  .hs-checks{list-style:none;padding-left:0}
  .hs-checks li{padding-left:18px;position:relative}
  .hs-checks li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-size:11px}
  .hs-empty{font-size:11.5px;color:var(--faint)}
  .hs-edit{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .hs-edit label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .hs-edit textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;min-height:52px;resize:vertical;background:var(--panel)}
  .handoff-sheet.inline{width:100%;max-height:none;box-shadow:none;border-radius:14px;padding:18px;margin:0 0 16px;background:#fff}
  .handoff-sheet.inline .hs-head h2{font-size:17px}
  .handoff-sheet.inline .hs-goal{margin-top:12px}
  .handoff-sheet.inline .hs-flow{margin:12px 0}
  .hs-card h3{display:flex;align-items:center;gap:6px}
  .hs-editbtn{margin-left:auto;border:0;background:transparent;color:var(--accent-strong);font:inherit;font-size:11.5px;cursor:pointer;padding:1px 2px}
  .hs-editbtn:hover{text-decoration:underline}
  .hs-inline{width:100%;min-height:70px;margin-top:7px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;resize:vertical;background:#fff}
  .hs-budget{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--panel-soft)}
  .hs-budget-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
  .hs-budget-head b{font-size:12.5px}
  .hs-budget-head span{font-size:11.5px;color:var(--muted)}
  .hs-budget-grid{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:10px;align-items:end}
  .hs-budget-grid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
  .hs-budget-grid input{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font:inherit;font-size:12.5px;background:#fff;color:var(--text)}
  .flow-dock{flex:none;padding:0 24px;max-height:46vh;overflow:auto}
  .flow-dock:empty{display:none}
  .flow-dock .flow-card{margin:0 auto 10px}
  .flow-toggle{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;font:inherit;font-size:11.5px;padding:2px 8px;cursor:pointer}
  .flow-toggle:hover{color:var(--text)}
  .flow-card.collapsed .flow-steps,.flow-card.collapsed .flow-text,.flow-card.collapsed .flow-tasks,
  .flow-card.collapsed .flow-risk,.flow-card.collapsed .flow-adjust{display:none}
  .flow-card.flash{box-shadow:0 0 0 3px rgba(37,99,235,.18);transition:box-shadow .2s ease}
  .flow-card{max-width:820px;margin:0 auto 16px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px}
  .flow-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .flow-head b{font-size:13px}
  .flow-head .link{margin-left:auto;font-size:12px}
  .flow-steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:10px 0 8px;font-size:11.5px;color:var(--faint)}
  .flow-steps span{padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel-soft)}
  .flow-steps span.done{color:var(--muted);border-color:#D8E6D8;background:#F3F8F3}
  .flow-steps span.on{color:var(--accent-strong);border-color:rgba(37,99,235,.2);background:var(--accent-soft);font-weight:600}
  .flow-steps.mini{margin:0 0 9px}
  .flow-text{font-size:12.5px;color:var(--text);line-height:1.65}
  .flow-text .muted{color:var(--muted)}
  .flow-tasks{display:grid;gap:3px;margin-top:8px}
  .flow-tasks .t{display:flex;gap:8px;font-size:12px;color:var(--muted)}
  .flow-tasks .t b{color:var(--text);font-weight:600;min-width:3.4rem}
  .flow-risk{margin-top:9px;border:1px solid #F5D7A7;background:#FFFBEB;border-radius:9px;padding:9px 11px}
  .flow-risk b{font-size:12px;color:#7c2d12}
  .flow-risk div{font-size:12px;color:#7c4a03;margin-top:3px;line-height:1.55}
  .flow-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
  .flow-busy{font-size:11.5px;color:var(--muted);margin-left:2px}
  .flow-adjust{margin-top:9px}
  .flow-adjust textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;resize:vertical}
  .hs-error{color:var(--bad);font-size:12px;margin-top:10px}
  .hs-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .hs-note{font-size:11.5px;color:var(--faint)}
  .hs-actions{display:flex;gap:8px}
  @media(max-width:640px){.hs-grid{grid-template-columns:1fr}.hs-flow{flex-wrap:wrap}.hs-line{display:none}}
  @media (max-width:1180px){.app{grid-template-columns:248px minmax(0,1fr)}.right{display:none}}
  @media (max-width:760px){.app{grid-template-columns:1fr}.side{display:none}}

/* ===== Minimal desktop system (2026) ===== */
html,body{height:100%;margin:0}
body{background:var(--bg-canvas);color:var(--text-primary);font:14px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:264px minmax(0,1fr) 0;height:100vh;background:var(--bg-canvas);transition:grid-template-columns .2s ease}
.app.inspector-open{grid-template-columns:264px minmax(0,1fr) 340px}
.side{background:var(--bg-sidebar);border-right:1px solid var(--border-subtle,var(--line));color:var(--text-primary);display:flex;flex-direction:column;min-width:0}
.brand{padding:20px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.brand b{font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--text-primary)}
.icon-btn.side-close,.icon-btn.mobile-nav{display:none}
.brand .dot{width:6px;height:6px;background:var(--accent);margin-right:7px}
.side-top{padding:0 14px 12px;display:grid;gap:9px}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:#EFEFF1}
.segmented a{padding:5px 8px;text-align:center;text-decoration:none;border-radius:7px;color:var(--side-muted);font-size:12px;line-height:1.4}
.segmented a:hover{color:var(--text-primary)}
.segmented a.active{background:#fff;color:var(--text-primary);box-shadow:0 1px 2px rgba(15,23,42,.06);font-weight:500}
.new-chat{width:100%;justify-content:center;padding:7px 10px;border-radius:9px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:12.5px}
.new-chat:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.side-scroll{overflow:auto;flex:1;padding:0 10px 12px;scrollbar-color:#c7cad1 transparent}
.side-section{font-size:11px;color:var(--text-muted);padding:14px 7px 6px;font-weight:500}
.project-name{padding:4px 8px 8px;font-size:12px;color:var(--text-secondary)}
#projSel{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--text-primary);font-size:12px}
.conv{padding:8px 9px;border-radius:8px;cursor:pointer;border:0;margin-bottom:2px;color:var(--text-primary)}
.conv:hover{background:rgba(15,23,42,.035)}
.conv.on{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.conv .t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .p{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.side-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.conn{font-size:11px;color:var(--text-muted);margin:0}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg-canvas)}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:saturate(1.2) blur(12px);flex:none}
.top-title{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.top h1{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{display:flex;align-items:center;gap:6px;margin:0;flex:none}
.top .meta #modelLabel{display:none}
.top .meta #objLabel{display:none}
.top-actions{display:flex;align-items:center;gap:7px;margin-left:auto;flex:none}
.badge{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text-secondary);white-space:nowrap}
.badge.running{color:var(--accent-focus);border-color:rgba(37,99,235,.22);background:#EFF6FF}
.badge.error{color:var(--bad);border-color:rgba(185,28,28,.2);background:#FEF2F2}
.badge.ok,.badge.idle{color:var(--text-secondary);border-color:var(--line);background:#F8F8F9}
.status-dot{width:7px;height:7px;border-radius:50%;background:#A1A1AA;flex:none}
.status-dot.running{background:var(--accent-focus);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.status-dot.error{background:var(--bad)}
.status-dot.ok{background:var(--ok)}
#toGoalBtn{background:transparent;border-color:transparent;color:var(--text-secondary);padding:5px 8px;border-radius:8px;font-size:12px}
#toGoalBtn:hover:not(:disabled){background:#F3F4F6;border-color:transparent;color:var(--text-primary)}
.icon-btn{width:30px;height:30px;border:1px solid transparent;background:transparent;border-radius:8px;display:inline-grid;place-items:center;color:var(--text-secondary);cursor:pointer;padding:0}
.icon-btn:hover{background:#F3F4F6;border-color:var(--line);color:var(--text-primary)}
.icon-btn svg{width:16px;height:16px;display:block}
.workspace-warning{flex:none;padding:7px 20px;background:#FFFBEB;border-bottom:1px solid rgba(180,83,9,.14);color:#7C4A03;font-size:11.5px;line-height:1.5}
.messages{flex:1;overflow:auto;padding:28px 24px 12px;scrollbar-color:#c7cad1 transparent}
.empty{color:var(--text-muted);text-align:center;padding:56px 20px;font-size:13px;line-height:1.75}
.welcome{max-width:460px;margin:0 auto;padding:52px 20px;text-align:center;color:var(--text-secondary)}
.welcome h2{font-size:18px;font-weight:600;color:var(--text-primary);margin:0 0 8px;letter-spacing:-.01em}
.welcome p{font-size:13px;line-height:1.75;margin:0 0 18px}
.welcome-mark span{width:8px;height:8px;border-radius:2px;background:var(--accent);opacity:.2}
.welcome-mark span:nth-child(2){opacity:.45}.welcome-mark span:nth-child(3){opacity:.85}
.welcome-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.welcome-note{font-size:11.5px;color:var(--text-muted);line-height:1.7}
.msg{max-width:760px;margin:0 auto 18px;display:flex;gap:0;align-items:flex-start}
.msg .who{display:none}
.msg .bubble{min-width:0;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;color:var(--text-primary)}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:#F3F4F6;border:0;border-radius:16px;padding:9px 14px;max-width:86%}
.msg.assistant .bubble{background:transparent;border:0;box-shadow:none;padding:2px 0;max-width:100%}
.msg .bubble.streaming::after{color:var(--text-muted)}
.msg .bubble.error{border:1px solid rgba(185,28,28,.2);background:#FEF2F2;color:var(--bad);border-radius:12px;padding:9px 12px}
.msg .bubble pre.code{background:#FAFAFA;border:1px solid var(--line);color:#111827;border-radius:10px;font:12.5px/1.65 var(--mono)}
.msg .bubble code{background:#F3F4F6;border:0;border-radius:4px;padding:1px 5px;font:12.5px/1.5 var(--mono);color:#374151}
.msg .bubble a{color:var(--accent-focus)}
.msg .bubble h2{font-size:16px}.msg .bubble h3,.msg .bubble h4{font-size:13.5px}
.md-table-wrap{border:1px solid var(--line);border-radius:10px}
.md-table-wrap th{background:#FAFAFA}
.rewind{border:0;background:transparent;color:var(--text-muted);font-size:11px;cursor:pointer;padding:2px 4px;align-self:center;border-radius:4px;opacity:0;transition:opacity .12s,color .12s}
.msg.user:hover .rewind,.rewind:focus-visible{opacity:1}
.rewind:hover{background:#F3F4F6;color:var(--bad)}
.rewind:disabled{opacity:.15;cursor:not-allowed}
.tools{max-width:760px;margin:-4px auto 12px 0;gap:6px}
.tool{border:1px solid var(--line);border-left:2px solid rgba(15,23,42,.18);background:#FAFAFA!important;border-radius:10px;padding:7px 10px;margin:0 0 6px;font-size:11.5px;max-width:760px}
.tool .th{color:var(--text-secondary);justify-content:flex-start;gap:10px}
.tool code,.tool pre{color:var(--text-secondary)}
.permission{max-width:760px;border:1px solid rgba(180,83,9,.18);border-left:3px solid var(--warn);border-radius:10px;background:#FFFBF5;padding:10px 12px;margin:0 auto 10px}
.permission b{color:#92400E;font-size:12px}
.approval-dock{flex:none;padding:0 20px;max-height:42vh;overflow:auto}
.approval-dock:empty{display:none}
.approval-dock .permission{max-width:760px;box-shadow:none}
.approval-dock .permission .btn{background:#fff;border-color:var(--line-strong);color:var(--text-primary)}
.approval-dock .permission .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.approval-dock .permission .btn.danger{background:#fff;border-color:rgba(185,28,28,.2);color:var(--bad)}
.reasoning,.thinking,.suggest,.notice{max-width:760px;margin:0 auto 16px;width:100%}
.reasoning-head{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border:1px solid var(--line);background:#FAFAFA;border-radius:9px;color:var(--text-secondary);font-size:12px;text-align:left;cursor:pointer}
.reasoning-head b{font-weight:600;color:var(--text-primary)}
.r-chevron{color:var(--faint);font-size:15px;line-height:1;width:14px;text-align:center;transition:transform .16s}
.reasoning.collapsed .r-chevron{transform:rotate(-90deg)}
.r-state{color:var(--text-muted)}
.reasoning-body{margin-top:6px;padding:10px 12px;border-left:2px solid var(--line-strong);background:#FAFAFA;border-radius:0 8px 8px 0;color:var(--text-secondary);font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.reasoning.collapsed .reasoning-body{display:none}
.thinking{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.thinking .who{display:none}
.think{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:12.5px}
.think-dots{display:inline-flex;gap:3px}
.think-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.3;animation:think 1.2s infinite ease-in-out}
.think-dots i:nth-child(2){animation-delay:.15s}
.think-dots i:nth-child(3){animation-delay:.3s}
@keyframes think{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.suggest{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);background:#FAFAFA;border-radius:12px}
.suggest-mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:#F3F4F6;color:var(--text-secondary);font-size:14px}
.suggest-body{min-width:0;flex:1}
.suggest-body b{font-size:12.5px;color:var(--text-primary)}
.suggest-body p{margin:5px 0 0;font-size:13px;line-height:1.6;color:var(--text-primary);overflow-wrap:anywhere}
.suggest-body .why{font-size:11.5px;color:var(--muted);margin-top:3px}
.suggest-actions{display:flex;gap:6px;margin-top:9px}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border:1px dashed var(--line-strong);background:#FAFAFA;border-radius:10px;color:var(--text-secondary);font-size:12px}
.notice .grow{flex:1;min-width:0}
.q-body{display:block}
.q-field{margin:10px 0}
.q-title{font-size:12.5px;font-weight:600;color:var(--text-primary)}
.q-desc{font-size:11.5px;color:var(--text-muted);margin:2px 0 6px;line-height:1.55}
.q-opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:4px 0;cursor:pointer;background:#fff}
.q-opt input{margin-top:2px;flex:none}
.q-opt b{font-size:12px;font-weight:500;color:var(--text-primary)}
.q-opt small{display:block;font-size:11px;color:var(--text-muted);margin-top:1px}
.q-input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;background:#fff;color:var(--text-primary)}
.q-actions{margin-top:8px;display:flex;gap:8px;align-items:center}
.q-error{color:var(--bad);font-size:11.5px;margin-top:5px}
.permission.question-card{background:#F8FAFD;border-color:#DCE6FA;border-left-color:#7C9CF5}
@media (prefers-reduced-motion: reduce){.think-dots i{animation:none;opacity:.6}}
.ghost-btn{border:0;background:transparent;color:var(--text-muted);font-size:11.5px;cursor:pointer;padding:2px 5px;border-radius:6px}
.ghost-btn:hover{background:#F3F4F6;color:var(--text-primary)}
.ghost-btn.on{background:#F3F4F6;color:var(--text-primary)}
.pill-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text-secondary);border-radius:999px;padding:4px 9px;font-size:11.5px;cursor:pointer}
.pill-toggle:hover{border-color:var(--line-strong);color:var(--text-primary)}
.pill-toggle.on{background:#F0FDF4;border-color:rgba(21,128,61,.2);color:var(--ok)}
.pill-toggle.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pill-toggle:disabled{opacity:.45;cursor:not-allowed}
.composer{flex:none;padding:8px 20px 16px;background:var(--bg-canvas);border-top:0}
.composer .box{max-width:760px;margin:0 auto;border:1px solid var(--line-strong);border-radius:18px;background:#fff;padding:8px 9px 6px;display:block;box-shadow:0 4px 20px rgba(0,0,0,.04);transition:border-color .15s,box-shadow .15s}
.composer .box:focus-within{border-color:rgba(15,23,42,.2);box-shadow:0 0 0 3px rgba(37,99,235,.07),0 4px 20px rgba(0,0,0,.04)}
.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:38px;max-height:180px;padding:4px 6px;background:transparent;line-height:1.65;font-size:14px;color:var(--text-primary)}
.composer-bar{display:flex;align-items:center;gap:7px;padding:3px 2px 0;min-width:0}
.composer-spacer{flex:1}
.model-wrap{position:relative;display:flex;align-items:center;gap:4px;min-width:0}
.model-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:#fff;min-width:0;max-width:260px}
.model-pill span{font-size:11px;color:var(--text-muted);white-space:nowrap}
.model-pill select{border:0;outline:0;background:transparent;color:var(--text-primary);font-size:11.5px;max-width:200px;min-width:0;padding:1px 0;text-overflow:ellipsis}
#modelSettings{width:28px;height:28px}
.composer-hint{font-size:10.5px;color:var(--text-muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint-line{max-width:760px;margin:5px auto 0;min-height:0}
.hint-line #hint{font-size:10.5px;color:var(--text-muted)}
.hint-line #hint:empty{display:none}
#eventHint:empty{display:none}
.send-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:#fff;display:inline-grid;place-items:center;flex:none;padding:0;cursor:pointer;transition:background .15s,transform .12s,opacity .15s}
.send-btn:hover:not(:disabled){background:var(--accent-strong);border-color:var(--accent-strong)}
.send-btn:active:not(:disabled){transform:scale(.96)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.send-btn svg{width:15px;height:15px;display:block}
.send-btn .ico-stop{display:none;width:8px;height:8px;border-radius:1.5px;background:#fff}
.send-btn.is-stop .ico-send{display:none}
.send-btn.is-stop .ico-stop{display:block}
.below{display:none}
.model-pop{position:absolute;left:0;right:auto;bottom:calc(100% + 10px);top:auto;width:460px;max-width:calc(100vw - 40px);max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 18px 50px rgba(15,23,42,.16);padding:14px;z-index:60}
.model-pop .mp-head b{font-size:12.5px;color:var(--text-primary)}
.model-pop label{display:grid;grid-template-columns:44px minmax(0,1fr) 86px;gap:7px;align-items:center;font-size:11.5px;color:var(--text-secondary);margin:6px 0}
.model-pop select{width:100%;max-width:none;border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:11.5px;background:#fff;color:var(--text-primary)}
.model-pop .hint{font-size:10.5px;color:var(--text-muted);margin-top:7px}
.mp-section{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
.mp-section h4{margin:0 0 6px;font-size:11px;color:var(--text-muted);font-weight:500}
.mp-rules summary{cursor:pointer;font-size:11.5px;color:var(--text-secondary);padding:4px 0}
.mp-rules-list{display:grid;gap:4px;margin-top:5px}
.rule-row{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:#FAFAFA}
.rule-row code{font:11px/1.4 var(--mono);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.rule-row .ghost-btn{color:var(--bad)}
.mp-token{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-secondary)}
.mp-token label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-secondary)}
.mp-token input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--text-primary);font-size:12px}
#reasoningPref{align-self:flex-start;border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#fff}
.right{display:block;background:#FBFBFC;border-left:1px solid var(--line);padding:16px 14px;overflow:hidden;min-width:0;opacity:0;pointer-events:none;transition:opacity .15s ease;scrollbar-color:#c7cad1 transparent}
.app.inspector-open .right{opacity:1;pointer-events:auto}
.right-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.right-head h2{font-size:12px;color:var(--text-secondary);font-weight:600;margin:0}
.inspector-tabs{display:flex;gap:14px;margin:0 0 14px;padding:0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0}
.inspector-tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--text-muted);border-radius:0;padding:0 0 8px;font-size:12px;border-bottom:2px solid transparent;box-shadow:none;display:inline-flex;align-items:center;gap:4px}
.inspector-tabs button:hover{color:var(--text-primary)}
.inspector-tabs button.active{color:var(--text-primary);border-bottom-color:var(--accent);background:transparent;box-shadow:none;font-weight:500}
.tab-badge{min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:#EFEFF1;color:var(--text-secondary);font-size:9.5px;line-height:15px;text-align:center}
.tab-badge.hidden{display:none}
.inspector-card[data-panel]{display:none}
.inspector-card[data-panel].active{display:block}
.right .card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:0 0 14px;margin:0 0 14px}
.right .card:last-child{border-bottom:0}
.right h2[data-section]{display:none}
.right .kv{grid-template-columns:58px minmax(0,1fr);font-size:11.5px}
.right .task{font-size:11.5px}
.right .hint{font-size:10.5px;line-height:1.6;color:var(--text-muted)}
.right .link{color:var(--accent-focus)}
#objSel{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;color:var(--text-primary);width:100%}
.modal{background:rgba(17,24,39,.32)}
.modal-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.18)}
.handoff-sheet{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 64px rgba(15,23,42,.16)}
.hs-goal,.hs-card,.hs-budget{background:#FAFAFA;border-color:var(--line)}
.hs-badge{background:#F3F4F6;color:var(--text-secondary)}
.hs-num{background:#F3F4F6;color:var(--text-secondary)}
.hs-chip{background:#F3F4F6;border-color:var(--line);color:var(--text-secondary)}
.hs-editbtn{color:var(--text-secondary)}
.flow-card{background:#fff;border-color:var(--line);border-radius:12px;box-shadow:none}
.flow-steps span{background:#FAFAFA;border-color:var(--line)}
.flow-steps span.on{background:#F3F4F6;border-color:var(--line-strong);color:var(--text-primary)}
.flow-steps span.done{background:#F0FDF4;border-color:rgba(21,128,61,.2)}
.flow-risk{background:#FFFBEB;border-color:rgba(180,83,9,.18)}
.flow-risk b,.flow-risk div{color:#7C4A03}
.btn{background:#fff;border:1px solid var(--line-strong);border-radius:8px;color:var(--text-primary);font-size:12px;padding:6px 11px;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:#FAFAFA;border-color:rgba(15,23,42,.2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{color:var(--bad);border-color:rgba(185,28,28,.22);background:#fff}
.btn.danger:hover{background:#FEF2F2}
.btn.small{padding:4px 8px;font-size:11px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:1100px){
  .app,.app.inspector-open{grid-template-columns:240px minmax(0,1fr)}
  .right{position:fixed;inset:0 0 0 auto;width:min(340px,88vw);z-index:70;display:block;opacity:1;pointer-events:none;transform:translateX(100%);transition:transform .2s ease;box-shadow:-12px 0 32px rgba(15,23,42,.12);padding:16px 14px}
  .app.inspector-open .right{transform:none;pointer-events:auto}
}
@media(max-width:820px){
  .app,.app.inspector-open{grid-template-columns:1fr}
  .side{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);z-index:80;transform:translateX(-100%);transition:transform .2s ease;box-shadow:16px 0 40px rgba(15,23,42,.14)}
  .app.mobile-nav-open .side{transform:none}
  .icon-btn.side-close,.icon-btn.mobile-nav{display:inline-grid}
  .top{padding:0 14px}
  .messages{padding:20px 14px 10px}
  .composer{padding:6px 14px 12px}
  .model-pop{left:-8px;right:-8px;width:auto;max-width:none}
}
@media(max-width:520px){.model-pill span{display:none}.model-pill{max-width:150px}.composer-hint{display:none}}
@media (prefers-reduced-motion: reduce){.app{transition:none}.send-btn{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><b>ProjectOS</b><button class="icon-btn side-close" id="sideClose" type="button" title="关闭导航" aria-label="关闭导航">×</button></div>
    <div class="side-top">
      <nav class="segmented" aria-label="主导航">
        <a class="active" href="/chat">聊天</a>
        <a href="/">驾驶舱</a>
      </nav>
      <button class="btn primary new-chat" id="newChat">＋ 新对话</button>
    </div>
    <div class="side-scroll">
      <div class="side-section">项目</div>
      <select id="projSel"></select>
      <div class="project-name" id="projName">默认项目</div>
      <div class="side-section">对话</div>
      <div id="convs"><div class="hint" style="padding:4px 6px">输入控制令牌后加载对话</div></div>
    </div>
    <div class="side-foot">
      <div class="conn" id="connState">正在连接…</div>
    </div>
  </aside>


  <main class="main">
    <div class="top">
      <button class="icon-btn mobile-nav" id="mobileNav" type="button" title="打开导航" aria-label="打开导航">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>
      <div class="top-title">
        <h1 id="title">新对话</h1>
        <div class="meta">
          <span class="status-dot" id="statusDot"></span>
          <span class="badge" id="status">空闲</span>
          <span id="objLabel"></span>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn small hidden" id="toGoalBtn" disabled>转为托管目标</button>
        <button class="icon-btn" id="inspectorToggle" type="button" title="显示或隐藏检查器" aria-label="检查器">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M13 4v12"/></svg>
        </button>
      </div>
    </div>
    <div class="workspace-warning hidden" id="workspaceWarning"></div>


    <div class="messages" id="messages">
      <div class="empty" id="empty">
        直接提问，或选择左侧历史对话。<br>
        需要执行任务时，点右上角“转为托管目标”。
      </div>
    </div>

    <div class="approval-dock" id="approvalDock"></div>
    <div class="flow-dock" id="objectiveFlow"></div>

    <div class="composer">
      <div class="box">
        <textarea id="input" placeholder="问点什么，或描述一个目标…" rows="1"></textarea>
        <div class="composer-bar">
          <div class="model-wrap">
            <label class="model-pill" title="聊天模型"><span>模型</span>
              <select id="modelSel"><option value="">跟随默认</option></select>
            </label>
            <button class="icon-btn" id="modelSettings" type="button" aria-expanded="false" title="模型与审批设置" aria-label="模型与审批设置">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.6"/><path d="M10 3.2v1.5M10 15.3v1.5M3.2 10h1.5M15.3 10h1.5M5.2 5.2l1 1M13.8 13.8l1 1M14.8 5.2l-1 1M6.2 13.8l-1 1"/></svg>
            </button>
            <div class="model-pop hidden" id="modelPop" role="dialog" aria-label="模型与审批设置">
              <div class="mp-head"><b>模型与审批设置</b><button class="btn small" id="mpRefresh" type="button">刷新列表</button></div>
              <label>聊天<select data-role="chat" name="role-chat"></select><select data-effort="chat" name="effort-chat" title="思考强度"></select></label>
              <label>规划<select data-role="planner" name="role-planner"></select><select data-effort="planner" name="effort-planner" title="思考强度"></select></label>
              <label>执行<select data-role="worker" name="role-worker"></select><select data-effort="worker" name="effort-worker" title="思考强度"></select></label>
              <label>审查<select data-role="reviewer" name="role-reviewer"></select><select data-effort="reviewer" name="effort-reviewer" title="思考强度"></select></label>
              <label>验收<select data-role="acceptance" name="role-acceptance"></select><select data-effort="acceptance" name="effort-acceptance" title="思考强度"></select></label>
              <label>汇报<select data-role="reporter" name="role-reporter"></select><select data-effort="reporter" name="effort-reporter" title="思考强度"></select></label>
              <label>审批<select data-role="approval" name="role-approval"></select><select data-effort="approval" name="effort-approval" title="思考强度"></select></label>
              <div class="hint" id="approvalHint" style="margin:-2px 0 7px 51px">建议选择低延迟、关闭思考（默认/最低）的轻量模型；高风险仍会弹卡。</div>
              <div class="hint" id="mpHint"></div>
              <div class="mp-section">
                <button class="ghost-btn" id="reasoningPref" type="button">思考过程：展开</button>
              </div>
              <div class="mp-section mp-rules">
                <details>
                  <summary>已记住的放行规则</summary>
                  <div class="mp-rules-list" id="approvalRulesList"><span class="hint">加载中…</span></div>
                </details>
              </div>
              <div class="mp-section">
                <form class="mp-token" onsubmit="return false"><label>控制令牌<input id="token" type="password" placeholder="本机可留空；远程模式必填" autocomplete="off"></label></form>
                <div class="hint">令牌只保存在本地浏览器。 <button class="ghost-btn" id="changeToken" type="button">更换</button></div>
              </div>
            </div>
          </div>
          <button class="pill-toggle" id="autoApproveBtn" type="button" disabled>帮我审批</button>
          <span class="composer-spacer"></span>
          <span class="composer-hint" id="eventHint"></span>
          <button id="send" class="send-btn" type="button" aria-label="发送" disabled>
            <svg class="ico-send" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 15V5M6 9l4-4 4 4"/></svg>
            <span class="ico-stop"></span>
          </button>
        </div>
        <div class="hint-line"><span id="hint"></span></div>
      </div>
    </div>


  </main>

   <aside class="right">
     <div class="right-head"><h2>检查器</h2><button class="icon-btn" id="inspectorClose" type="button" title="收起检查器" aria-label="收起检查器">×</button></div>
     <div class="inspector-tabs" role="tablist" aria-label="检查器">
       <button class="active" data-tab="overview" role="tab">概览</button>
       <button data-tab="tasks" role="tab">任务<span class="tab-badge hidden" id="tabBadgeTasks"></span></button>
       <button data-tab="approvals" role="tab">审批<span class="tab-badge hidden" id="tabBadgeApprovals"></span></button>
       <button data-tab="evidence" role="tab">证据<span class="tab-badge hidden" id="tabBadgeEvidence"></span></button>
     </div>
     <div class="card inspector-card" data-panel="overview">
      <select id="objSel">
        <option value="">不关联目标</option>
      </select>
      <div class="hint" style="margin-top:7px">新建对话前选择目标；已打开会话的关联仅在新建对话时生效。写文件/执行命令仍会逐次请求批准。</div>
    </div>
     <div class="card inspector-card" data-panel="overview" id="projectCard"><div class="hint">项目上下文加载中…</div></div>
     <div class="card inspector-card" data-panel="overview" id="objCard">
      <div class="hint">未关联 Objective。</div>
    </div>
     <h2 data-section="tasks">任务</h2>
     <div class="card inspector-card" data-panel="tasks" id="tasks"><div class="hint">关联目标后显示任务。</div></div>
     <div class="card inspector-card" data-panel="approvals" id="approvalInspector"><div class="hint">当前没有待处理审批。</div></div>
     <h2 data-section="evidence">证据</h2>
     <div class="card inspector-card" data-panel="evidence" id="evidenceCard">
       <div class="hint">关联目标后显示交付产物与共享证据。</div>
     </div>
  </aside>

</div>

<template id="handoffTpl">
  <div class="handoff-sheet" role="group" aria-label="确认托管目标">
    <header class="hs-head">
      <div>
        <span class="hs-badge">托管目标</span>
        <h2>把这个对话变成可执行的目标</h2>
        <p class="hs-sub">从对话中提取。确认后只创建目标和计划，不会自动执行。</p>
      </div>
      <button class="hs-close" id="hCancelTop" type="button" aria-label="关闭">×</button>
    </header>

    <section class="hs-goal">
      <label for="hGoal">目标</label>
      <textarea id="hGoal" rows="2" placeholder="一句话说明要达成什么"></textarea>

    <section class="hs-budget" aria-label="执行预算">

      <div class="hs-budget-grid">
        <label>token 上限<input id="hMaxTokens" type="number" min="1000" step="1000" value="600000"></label>
        <span class="hint" style="align-self:end;padding-bottom:6px">运行与审查次数由规划和任务数决定，不在这里手填。</span>

    <section class="hs-flow" aria-label="流程">
      <div class="hs-step"><span class="hs-num">1</span><div><b>创建目标</b><small>写入项目状态</small></div></div>

      <div class="hs-step"><span class="hs-num">2</span><div><b>生成计划</b><small>任务 DAG 与验收标准</small></div></div>

      <div class="hs-step"><span class="hs-num">3</span><div><b>你确认计划</b><small>确认后才执行</small></div></div>

    <section class="hs-grid">
      <div class="hs-card">
        <h3>硬约束 <span class="hs-count" id="hsConstraintCount"></span><button class="hs-editbtn" type="button" data-edit="hConstraints">编辑</button></h3>
        <div class="hs-chips" id="hsConstraintsView"></div>
        <textarea class="hs-inline hidden" id="hConstraints" placeholder="每行一条"></textarea>
      </div>
      <div class="hs-card">
        <h3>预期产物<button class="hs-editbtn" type="button" data-edit="hExpected">编辑</button></h3>
        <ul class="hs-list" id="hsOutputsView"></ul>
        <textarea class="hs-inline hidden" id="hExpected" placeholder="每行一条"></textarea>
      </div>
      <div class="hs-card">
        <h3>验收标准<button class="hs-editbtn" type="button" data-edit="hAcceptance">编辑</button></h3>
        <ul class="hs-list hs-checks" id="hsAcceptanceView"></ul>
        <textarea class="hs-inline hidden" id="hAcceptance" placeholder="每行一条"></textarea>
      </div>
      <div class="hs-card">
        <h3>已确认决策<button class="hs-editbtn" type="button" data-edit="hDecisions">编辑</button></h3>
        <div class="hs-chips" id="hsDecisionsView"></div>
        <textarea class="hs-inline hidden" id="hDecisions" placeholder="每行一条"></textarea>
      </div>
    </section>

    <div class="hs-error" id="hError"></div>
    <footer class="hs-foot">
      <span class="hs-note">不会自动执行；计划仍需你确认</span>
      <div class="hs-actions">
        <button class="btn" id="hCancel" type="button">再看看</button>
        <button class="btn primary" id="hConfirm" type="button">创建目标并生成计划</button>
      </div>
    </footer>
  </div>
</template>

<script>
const state = { token:'', conv:null, detail:null, stream:null, lastSeq:0, convs:[], objs:[], projects:[], models:{}, streaming:null, rendered:new Set(), lastUser:'', modelSettings:{}, modelVariants:{}, modelList:[], autoRefreshed:false, reasoningEl:null, reasoningExpanded:(localStorage.getItem('reasoningExpanded') !== '0'), handoff:null, lastSuggestion:null, flowSig:'', flowBusy:false, flowBusyKey:'', flowCollapsed:false, objectiveBudget:null, remote:false, running:false, hasUserMessage:false, approvalRules:[] };

function $(id){ return document.getElementById(id); }
function convCurrent(convID, gen){ return (gen === undefined || gen === (state.convGen || 0)) && !!state.conv && state.conv.id === convID; }
function keepFlowLast(){
  const box = $('messages');
  const flow = box && box.querySelector('.flow-card[data-obj]');
  if(flow) box.appendChild(flow);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clip(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n)+'…' : s; }
function fmt(t){ if(!t) return ''; const d=new Date(t); return d.toLocaleString('zh-CN',{hour12:false}); }

function setInspectorTab(name){
  document.querySelectorAll('.inspector-tabs [data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.inspector-card[data-panel]').forEach(card => {
    card.classList.toggle('active', card.dataset.panel === name);
    card.classList.toggle('inactive', card.dataset.panel !== name);
  });
  document.querySelectorAll('[data-section]').forEach(h => h.classList.toggle('hidden', h.dataset.section !== name));
}
document.querySelectorAll('.inspector-tabs [data-tab]').forEach(b => b.onclick = () => setInspectorTab(b.dataset.tab));
setInspectorTab('overview');
function setInspector(open){ $('app').classList.toggle('inspector-open', !!open); }
function setTabBadge(id,n){ const el=$(id); if(!el) return; el.textContent = n > 0 ? String(n) : ''; el.classList.toggle('hidden', !(n > 0)); }
function updateInspectorBadges(){
  const d = state.objectivePanel;
  setTabBadge('tabBadgeTasks', d && d.counts ? (d.counts.total || 0) : 0);
  setTabBadge('tabBadgeApprovals', document.querySelectorAll('#approvalDock .permission').length);
  const shared = (d && d.sharedArtifacts) || [];
  const verified = (state.projectSnapshot && state.projectSnapshot.verified) || [];
  setTabBadge('tabBadgeEvidence', shared.length + verified.length);
}
function closeMobileNav(){ $('app').classList.remove('mobile-nav-open'); }
$('mobileNav').onclick = () => $('app').classList.add('mobile-nav-open');
$('sideClose').onclick = closeMobileNav;
$('inspectorToggle').onclick = () => setInspector(!$('app').classList.contains('inspector-open'));
$('inspectorClose').onclick = () => setInspector(false);
window.addEventListener('resize', () => {
  if(window.innerWidth <= 1100 && $('app').classList.contains('inspector-open') &&
     !document.querySelector('#approvalDock .permission')) setInspector(false);
});

async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({'X-Kernel-Token': state.token}, opts.headers || {});
  const res = await fetch(path, opts);
  const text = await res.text();
  let body = text;
  try { body = text ? JSON.parse(text) : null; } catch(e) {}
  if(!res.ok){
    if(res.status === 401) showTokenPrompt();
    const msg = (body && (body.error || body.message)) || text || res.statusText;
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return body;
}

function fileHref(objectiveId, path){
  return '/files/' + encodeURIComponent(objectiveId) + '/' + String(path || '').split('/').map(encodeURIComponent).join('/');
}

async function openAuthedFile(objectiveId, path){
  try {
    const res = await fetch(fileHref(objectiveId, path), {headers:{'X-Kernel-Token': state.token}});
    if(res.status === 401){ showTokenPrompt(); throw new Error('需要控制令牌'); }
    if(!res.ok) throw new Error('打开失败：HTTP ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.download = String(path || 'artifact').split('/').pop();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch(e) { alert(e.message); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-file-path]');
  if(!el) return;
  e.preventDefault();
  openAuthedFile(el.dataset.fileObj, el.dataset.filePath);
});

function bootToken(){
  const frag = new URLSearchParams(location.hash.replace(/^#/,''));
  if(frag.get('token')){ localStorage.setItem('kernelToken', frag.get('token')); history.replaceState(null,'',location.pathname); }
  state.token = localStorage.getItem('kernelToken') || '';
  $('token').value = state.token;
  const tokenField = $('token').closest('.mp-token');
  if(tokenField) tokenField.classList.toggle('hidden', !!state.token);
  $('connState').textContent = state.token ? '本地工作区 · 已连接' : '未连接：输入控制令牌';
}
$('token').onchange = () => { state.token = $('token').value.trim(); localStorage.setItem('kernelToken', state.token); location.reload(); };
$('changeToken').onclick = () => {
  const field = $('token').closest('.mp-token'); if(field) field.classList.remove('hidden');
  $('token').classList.remove('hidden'); $('token').focus();
};

function showTokenPrompt(){
  const pop = $('modelPop');
  if(pop) pop.classList.remove('hidden');
  const input = $('token');
  if(input){
    const field = input.closest('.mp-token'); if(field) field.classList.remove('hidden');
    input.classList.remove('hidden'); input.focus();
  }
  $('eventHint').textContent = '需要控制令牌';
}

function renderApprovalRules(){
  const box = $('approvalRulesList');
  if(!box) return;
  const rules = state.approvalRules || [];
  if(!rules.length){ box.innerHTML = '<span class="hint">还没有“始终允许”规则。</span>'; return; }
  box.innerHTML = rules.map((r, i) =>
    '<div class="rule-row"><code>' + esc((r.prefix || []).join(' ')) + '</code>' +
    '<span class="hint">' + esc(r.action || '') + '</span>' +
    '<button class="ghost-btn" type="button" data-rule="' + i + '" title="删除这条规则">删除</button></div>').join('');
  box.querySelectorAll('[data-rule]').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await api('/api/approval-rules', {method:'DELETE', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({index:Number(btn.dataset.rule)})});
        await loadApprovalRules();
      } catch(e) { alert('删除规则失败：' + e.message); btn.disabled = false; }
    };
  });
}

async function loadApprovalRules(){
  const box = $('approvalRulesList');
  try {
    const d = await api('/api/approval-rules');
    state.approvalRules = (d && d.rules) || [];
    renderApprovalRules();
  } catch(e) {
    if(box) box.innerHTML = '<span class="hint">' + esc(e.message) + '</span>';
  }
}

function showWorkspaceWarning(kind){
  const el = $('workspaceWarning');
  if(!el) return;
  const text = kind === 'icloud'
    ? '当前工作区位于 iCloud 同步目录；建议换到本地磁盘项目目录，避免文件被驱逐或审批边界被放宽。'
    : kind === 'home'
      ? '当前工作区是用户主目录；建议选择具体项目目录，避免工作区边界过大。'
      : kind === 'root'
        ? '当前工作区是文件系统根目录；建议选择具体项目目录。'
        : '';
  el.textContent = text;
  el.classList.toggle('hidden', !text);
}

async function loadModels(){
  try { state.models = await api('/api/models'); } catch(e) { return; }
  state.modelSettings = state.models.settings || {};
  state.modelVariants = state.modelSettings.variants || {};
  state.modelList = state.models.models || [];
  renderModelSelectors();
  // A fresh workspace has no cache; fill it once instead of showing an empty list.
  if(!state.modelList.length && !state.autoRefreshed){
    state.autoRefreshed = true;
    await refreshModelList(true);
  }
}

const ROLE_LABELS = {chat:'聊天', planner:'规划', worker:'执行', reviewer:'审查', acceptance:'验收', reporter:'汇报', approval:'审批'};

function renderModelSelectors(){
  const list = state.modelList || [];
  const settings = state.modelSettings || {};
  const chat = settings.chat || settings.worker || '';
  state.chatModel = chat;
  const sel = $('modelSel');
  if(sel){
    let html = '<option value="">跟随默认</option>' + list.map(m =>
      '<option value="'+esc(m)+'"'+(m===chat?' selected':'')+'>'+esc(m)+'</option>').join('');
    if(chat && !list.includes(chat))
      html += '<option value="'+esc(chat)+'" selected>'+esc(chat)+'（未缓存）</option>';
    if(!list.length) html += '<option disabled>模型列表为空，打开“设置 → 刷新列表”</option>';
    sel.innerHTML = html;
    sel.title = '聊天模型：' + (chat || '跟随默认');
  }
  document.querySelectorAll('#modelPop select[data-role]').forEach(el => {
    const role = el.dataset.role;
    const current = settings[role] || '';
    let html = '<option value="">跟随默认</option>' + list.map(m =>
      '<option value="'+esc(m)+'"'+(m===current?' selected':'')+'>'+esc(m)+'</option>').join('');
    if(current && !list.includes(current))
      html += '<option value="'+esc(current)+'" selected>'+esc(current)+'（未缓存）</option>';
    el.innerHTML = html;
  });
  const efforts = [['', '默认'], ['minimal', '最低'], ['low', '低'], ['medium', '中'], ['high', '高'], ['max', '最高']];
  document.querySelectorAll('#modelPop select[data-effort]').forEach(el => {

    const d = await api('/api/projects/'+encodeURIComponent(projectId));
    if(gen !== (state.convGen || 0)) return;
    const s = d.snapshot || {};
    state.projectSnapshot = s;
    const objs = (s.objectives || []).filter(o => o.status !== 'cancelled');
    const verified = s.verified || [];
    const blockers = s.blockers || [];
    const decisions = s.decisions || [];
    let html = '<div class="kv"><div>项目</div><div><b>'+esc(s.name || d.project.name)+'</b></div>' +
      '<div>目标</div><div>'+objs.length+' 个</div></div>';

    if(objs.length) html += '<div style="margin-top:8px">'+objs.slice(0,4).map(o =>
      '<div class="task"><span class="id">'+esc(o.id)+'</span><span>'+esc(clip(o.title || o.goal, 26))+'</span><span class="st">'+esc(statusLabel(o.status))+'</span></div>').join('')+'</div>';
    if(blockers.length) html += '<div class="hint" style="margin-top:8px;color:#b42318">阻塞：'+esc(clip(blockers[0], 100))+'</div>';
    if(verified.length) html += '<div class="hint" style="margin-top:8px">已验证：'+esc(verified.length)+' 项</div>';
    if(decisions.length) html += '<div class="hint" style="margin-top:6px">决策：'+esc(clip(decisions[decisions.length-1], 100))+'</div>';

async function selectConv(id){
  closeMobileNav();
  const gen = (state.convGen || 0) + 1;
  state.convGen = gen;
  if(state.stream){ state.stream.abort(); state.stream = null; }
  state.conv = null; state.detail = null; state.lastSeq = 0; state.streaming = null; state.rendered.clear(); state.lastUser = ''; state.resyncCount = 0; state.objectiveBudget = null; state.handoff = null; state.flowBusy = false; state.flowBusyKey = ''; state.flowSig = ''; clearReasoning();
  document.querySelectorAll('.flow-card[data-obj]').forEach(el => el.remove());
  $('messages').innerHTML = '<div class="empty">正在同步工作区…</div>';
  document.querySelectorAll('#approvalDock .permission').forEach(el => el.remove());
  $('approvalInspector').innerHTML = '<div class="hint">当前没有待处理审批。</div>';
  try {
    const d = await api('/api/conversations/'+encodeURIComponent(id));
    if(gen !== state.convGen) return;
    state.conv = d.conversation; state.detail = d;
    $('objSel').disabled = true;
    $('title').textContent = d.conversation.title || '新对话';
    syncConvBadge(d.conversation.status);
    updateAutoApprove();
    if($('modelLabel')) $('modelLabel').textContent = d.conversation.model || '默认模型';
    syncRunControls(d.conversation.status);
    state.hasUserMessage = (d.messages || []).some(m => m.role === 'user');
    updateToGoal();
    setInspector(!!d.conversation.objectiveId && window.innerWidth > 1100);
    if($('projSel') && d.conversation.projectId) $('projSel').value = d.conversation.projectId;
    await loadProjectPanel(d.conversation.projectId || ($('projSel') ? $('projSel').value : ''));
    if(gen !== state.convGen) return;
    $('objSel').value = d.conversation.objectiveId || '';
    const obj = state.objs.find(o => o.id === d.conversation.objectiveId);
    if($('objLabel')) $('objLabel').textContent = obj ? ('· ' + (obj.title || obj.goal)) : '';
    renderMessages(d.messages || []);
    state.lastSeq = d.lastEventSeq || 0;
    renderPendingPermissions(d.permissions || []);
    updateToGoal();
    updateInspectorBadges();
    if(d.conversation.status === 'running') showThinking('正在思考'); else hideThinking();
    if(d.conversation.objectiveId){
      await loadObjectiveBudget();
      if(gen !== state.convGen) return;
      state.flowSig = '';
      await renderObjectiveFlow(d.conversation.objectiveId);
      if(gen !== state.convGen) return;
    } else {
      document.querySelectorAll('.flow-card[data-obj]').forEach(el => el.remove());
      state.flowSig = '';
      await loadObjPanel(null);
    }
    startStream(d.conversation.id, d.lastEventSeq || 0);
    // A draft survives a reload; reopen the wizard instead of losing the work.
    if(!d.conversation.objectiveId){
      api('/api/conversations/'+encodeURIComponent(id)+'/handoff').then(h => {
        if(h && (h.status === 'draft' || h.status === 'confirming') && state.conv && state.conv.id === id) mountHandoff(h);
      }).catch(e => { if(e.status !== 404) $('eventHint').textContent = '恢复托管草稿失败：' + e.message; });
    }
    await loadConvs();
  } catch(e) {
    if(gen === state.convGen) $('messages').innerHTML = '<div class="empty">'+esc(e.message)+'</div>';
  }
}

function addMessage(role, text, id){
  const key = role+'\x00'+text;
  if(id && state.rendered.has(id)) return null;
  // An empty placeholder key must never block the next turn's live stream.
  if(!id && text && state.rendered.has(key)) return null;
  if(id) state.rendered.add(id);
  state.rendered.add(key);
  const box = $('messages');
  const empty = $('empty'); if(empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if(id) el.dataset.mid = id;
  el.innerHTML = '<div class="who">'+(role === 'user' ? '你' : 'AI')+'</div>' +
    '<div class="bubble">'+(role === 'assistant' ? md(text) : esc(text))+'</div>';
  const flow = box.querySelector('.flow-card[data-obj]');
  if(flow) box.insertBefore(el, flow); else box.appendChild(el);
  if(role === 'user' && id) attachRewind(el, id);
  keepFlowLast();
  scrollBottom();
  return el.querySelector('.bubble');
}

// Minimal, escape-first Markdown: code fences, inline code, bold, lists, links.
function inlineMd(s){
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function md(text){
  let raw = esc(text || '');
  const codes = [];
  raw = raw.replace(/```[a-zA-Z0-9_+-]*\n([\s\S]*?)```/g, (m, code) => {
    codes.push('<pre class="code"><code>'+code.replace(/\n$/,'')+'</code></pre>');
    return '\u0000B'+(codes.length-1)+'\u0000';
  });

  const lines = raw.split('\n');
  const out = [];
  const isSep = l => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(l);
  const splitRow = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x => x.trim());
  const isTableStart = i => lines[i].includes('|') && i + 1 < lines.length && isSep(lines[i+1]);
  const isList = l => /^\s*[-*]\s+/.test(l);
  const isOrdered = l => /^\s*\d+\.\s+/.test(l);
  const isQuote = l => /^\s*&gt;\s?/.test(l);
  const isHeading = l => /^#{1,6}\s+/.test(l);
  const isRule = l => /^\s*(---|\*\*\*|___)\s*$/.test(l);
  const isCode = l => /^\u0000B\d+\u0000$/.test(l.trim());

  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(!line.trim()){ i++; continue; }

    let h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      const level = Math.min(6, h[1].length + 1);
      out.push('<h'+level+'>'+inlineMd(h[2])+'</h'+level+'>'); i++; continue;
    }

    if(isTableStart(i)){
      const head = splitRow(line);
      const rows = [];
      i += 2;
      while(i < lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(splitRow(lines[i])); i++;
      }
      const cell = (tag, text) => '<'+tag+'>'+inlineMd(text || '')+'</'+tag+'>';
      out.push('<div class="md-table-wrap"><table><thead><tr>'+
        head.map(c => cell('th', c)).join('')+'</tr></thead><tbody>'+
        rows.map(r => '<tr>'+head.map((_, idx) => cell('td', r[idx] || '')).join('')+'</tr>').join('')+
        '</tbody></table></div>');
      continue;
    }

    if(isList(line)){
      const items = [];
      while(i < lines.length && isList(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>'); i++;
      }
      out.push('<ul>'+items.join('')+'</ul>'); continue;
    }

    if(isOrdered(line)){
      const items = [];
      while(i < lines.length && isOrdered(lines[i])){
        items.push('<li>'+inlineMd(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++;
      }
      out.push('<ol>'+items.join('')+'</ol>'); continue;
    }

    if(isQuote(line)){
      const parts = [];
      while(i < lines.length && isQuote(lines[i])){
        parts.push(inlineMd(lines[i].replace(/^\s*&gt;\s?/,''))); i++;
      }
      out.push('<blockquote>'+parts.join('<br>')+'</blockquote>'); continue;
    }

    if(isRule(line)){ out.push('<hr>'); i++; continue; }
    if(isCode(line)){ out.push(line.trim()); i++; continue; }

    const para = [line];
    i++;
    while(i < lines.length && lines[i].trim() &&
          !isHeading(lines[i]) && !isList(lines[i]) && !isOrdered(lines[i]) &&
          !isQuote(lines[i]) && !isRule(lines[i]) && !isCode(lines[i]) &&
          !isTableStart(i)){
      para.push(lines[i]); i++;
    }
    out.push('<p>'+inlineMd(para.join('<br>'))+'</p>');
  }
  return out.join('').replace(/\u0000B(\d+)\u0000/g, (m, idx) => codes[+idx]);
}
function scrollBottom(){ const box=$('messages'); box.scrollTop = box.scrollHeight; }
function attachRewind(el, id){
  if(!el || !id) return;
  el.dataset.mid = id;
  el.querySelectorAll('.rewind').forEach(b => b.remove());
  const b=document.createElement('button');
  b.className='rewind'; b.type='button'; b.textContent='撤回';
  b.title = state.conv && state.conv.status === 'running'
    ? '撤回（会先停止当前生成）'
    : '撤回这条消息及之后的回复';
  b.onclick=()=>rewindTo(el,b);
  el.appendChild(b);
}
async function rewindTo(el, btn){
  if(!state.conv) return;
  if(!el.dataset.mid){ $('eventHint').textContent = '这条消息缺少远端 ID，无法撤回'; return; }
  const running = state.conv.status === 'running';
  const prompt = running
    ? '会话正在生成。撤回会先停止当前生成，再回退到这条消息。\n\n继续？'
    : '撤回这条消息及之后的回复？\n\n会回退模型上下文；已执行的文件、命令或目标任务不会恢复。';
  if(!confirm(prompt)) return;
  if(running){
    btn.disabled = true; btn.textContent = '停止中…';
    try { await api('/api/conversations/'+encodeURIComponent(state.conv.id)+'/stop', {method:'POST'}); }
    catch(e) { alert('停止失败：'+e.message); btn.disabled=false; btn.textContent='撤回'; return; }
    for(let i=0;i<30;i++){
      await new Promise(r=>setTimeout(r,300));
      try {
        const d = await api('/api/conversations/'+encodeURIComponent(state.conv.id));
        state.conv = d.conversation;
      } catch(e) {}
      if(state.conv.status !== 'running') break;
    }
    if(state.conv.status === 'running'){
      alert('停止超时，请稍后再试');
      btn.disabled=false; btn.textContent='撤回'; return;
    }
  }
  btn.disabled = true; btn.textContent = '撤回中…';
  const convId = state.conv.id;
  const finish = async (res) => {
    await loadConvs();
    await selectConv(convId);
    if(res.restoredText){
      const input=$('input'); input.value=res.restoredText;
      input.dispatchEvent(new Event('input')); input.focus();
    }
    if(res.remoteForked === false){
      addNotice('已从本地对话中移除 ' + (res.removed || 0) + ' 条；OpenCode 会话里已没有这条旧消息，服务端上下文未回退。');
    }
    $('eventHint').textContent = res.remoteForked === false
      ? ('本地回退 ' + (res.removed || 0) + ' 条')
      : ('已撤回 ' + (res.removed || 0) + ' 条消息');
  };
  try {
    const res = await api('/api/conversations/'+encodeURIComponent(convId)+'/rewind', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messageId: el.dataset.mid})
    });
    await finish(res);
  } catch(e) {
    if(e.status === 409 && /rewind_local_only/.test(e.message)){
      if(confirm('这条消息已经不在 OpenCode 会话里了。只能从本地对话中移除它和之后的回复；服务端上下文不会回退。继续？')){
        try {
          const res = await api('/api/conversations/'+encodeURIComponent(convId)+'/rewind', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({messageId: el.dataset.mid, localOnly:true})
          });
          await finish(res);
          return;
        } catch(e2) { alert('撤回失败：'+e2.message); }
      }
      btn.disabled = false; btn.textContent = '撤回';
      return;
    }
    alert('撤回失败：'+e.message);
    btn.disabled = false; btn.textContent = '撤回';
  }
}

async function loadObjPanel(objectiveId, gen){
  gen = (gen === undefined) ? (state.convGen || 0) : gen;
  if(gen !== (state.convGen || 0)) return;
  if(!objectiveId){
    if(state.conv && state.conv.objectiveId) return;
    state.objectivePanel = null;
    $('objCard').innerHTML = '<div class="hint">未关联 Objective。</div>';
    $('tasks').innerHTML = '<div class="hint">关联目标后显示任务。</div>';
    renderEvidence(null);
    updateInspectorBadges();
    return;
  }
  try {
    const d = await api('/api/objectives/'+encodeURIComponent(objectiveId));
    if(gen !== (state.convGen || 0) || !state.conv || state.conv.objectiveId !== objectiveId) return;
    state.objectivePanel = d;
    const view = objectiveView(d);
    const counts = d.counts || {};
    let stage = '目标';
    let needsRunApproval = false;
    if(d.objective.status === 'planned') stage = '审批';
    else if(d.objective.status === 'active'){
      needsRunApproval = (d.approvalReasons || []).length > 0 && counts.running === 0 &&
        counts.blocked === 0 && counts.accepted === 0;
      if(counts.blocked > 0 || needsRunApproval) stage = '审批';
      else if(counts.running > 0 || counts.pending > 0) stage = '执行';
      else if(counts.total && counts.accepted === counts.total) stage = '验收';
    } else if(d.objective.status === 'completed') stage = '交付';
    const steps = ['目标','计划','审批','执行','验收','交付'];
    const cur = Math.max(0, steps.indexOf(stage));
    const strip = steps.map((name, i) =>
      '<span class="' + (i < cur ? 'done' : (i === cur ? 'on' : '')) + '">' + name + '</span>').join('');
    let next = '';
    if(d.objective.status === 'draft') next = '正在生成计划…';
    else if(d.objective.status === 'planned') next = '确认计划后开始执行。';
    else if(counts.blocked > 0) next = '批准恢复或重新规划。';
    else if(needsRunApproval) next = '核对命令后开始执行。';
    else if(counts.running > 0) next = '正在执行；完成后自动验收。';
    else if(counts.pending > 0) next = '可以开始执行。';
    else if(d.objective.status === 'completed') next = '已完成，可查看交付。';
    else if(d.objective.status === 'failed') next = '重新规划或取消。';
    $('objCard').innerHTML = '<div class="flow-steps mini">' + strip + '</div>' +
      '<div class="hint" style="margin-bottom:9px">' + esc(next) + '</div>' +
      '<div class="kv"><div>状态</div><div><span class="pill ' + view.cls + '">' + esc(view.label) + '</span></div>' +
      '<div>计划</div><div>v'+esc(d.planVersion || d.objective.planVersion || '—')+'</div>' +
      '<div>交付</div><div>'+(d.delivery ? '已生成' : '未生成')+'</div>' +
      '<div>目标</div><div>'+esc(clip(d.objective.goal, 180))+'</div></div>' +
      '<div style="margin-top:9px"><a class="link" href="/#goal='+encodeURIComponent(objectiveId)+'">在驾驶舱查看 →</a></div>';
    const findings = d.objectiveFindings || [];
    if(findings.length){
      $('objCard').insertAdjacentHTML('beforeend', '<div class="hint" style="margin-top:8px;color:#b42318">目标验收：' +
        esc(findings.map(f => (f.Severity || '') + ' ' + (f.Message || '')).join('；')) + '</div>');
    }
    const tasks = d.tasks || [];
    const c = d.counts || {};
    $('tasks').innerHTML = (tasks.length ? '<div class="hint" style="margin-bottom:6px">' +
        esc((c.accepted||0)+'/'+(c.total||tasks.length)+' 已通过 · '+(c.running||0)+' 执行中 · '+(c.blocked||0)+' 被卡住') + '</div>' : '') +
      (tasks.length ? tasks.map(t =>
      '<div class="task"><span class="id">'+esc(t.id)+'</span><span>'+esc(clip(t.artifactPath || t.id, 24))+'</span><span class="st">'+esc(taskLabel(t.status))+'</span></div>').join('')
      : '<div class="hint">还没有任务。</div>');
    renderEvidence(d, objectiveId);
    updateInspectorBadges();
  } catch(e) {
    if(gen === (state.convGen || 0) && state.conv && state.conv.objectiveId === objectiveId) {
      $('objCard').innerHTML = '<div class="hint">'+esc(e.message)+'</div>';
    }
  }
}

async function send(){

  const convID = state.conv.id, gen = state.convGen || 0;
  const current = () => gen === (state.convGen || 0) && state.conv && state.conv.id === convID;
  // A short "可以开始规划" answers the suggestion in the transcript and opens
  // the in-stream wizard; it is a control action, not another model turn.
  if(!state.conv.objectiveId && state.lastSuggestion && looksLikeStart(text)){
    $('input').value = ''; $('input').style.height = 'auto';
    await startHandoff(null, text);

  }
  $('input').value = ''; $('input').style.height = 'auto';
  state.lastUser = text;
  if(state.conv) state.conv.status = 'running';
  state.reasoningEl = null;
  document.querySelectorAll('.suggest').forEach(el => el.remove());
  const stopped=$('stoppedNote'); if(stopped) stopped.remove();

      headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    if(!current()) return;

    await loadConvs();

    hideThinking();
    addMessage('assistant', '发送失败：'+e.message, '');
    $('status').textContent = '错误'; $('status').className = 'badge error';
    syncRunControls('error');

async function waitIdle(id, timeoutMs){
  const deadline = Date.now() + (timeoutMs || 8000);
  while(Date.now() < deadline){
    try {
      const d = await api('/api/conversations/'+encodeURIComponent(id));
      if(d.conversation.status !== 'running') return d.conversation;
    } catch(e) {}
    await new Promise(r => setTimeout(r, 400));
  }
  return null;
}

function looksLikeStart(text){
  const t = String(text || '').trim().replace(/[。.!！?？~～\s]+$/, '');
  if(!t || t.length > 18) return false;
  if(/(不要|先不|别|暂不|取消|不用|等等)/.test(t)) return false;
  return /^(可以|好|行|嗯|对|是|确认|ok|okay)?[，, ]{0,2}(开始|启动|托管|规划)/i.test(t);
}
